<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UI Vault · 本地源码收藏</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body><header><h1>UI Vault</h1><p>本地源码收藏 · 仅展示文本，不运行第三方组件；快照登记不代表恢复成功</p></header>
<form id="filters">
<label>搜索<input id="query" name="query" type="search" placeholder="名称、标签、依赖、技术栈"></label>
<label>来源<select id="source"><option value="">全部来源</option></select></label>
<label>用途 / 分类<select id="category"><option value="">全部用途</option></select></label>
<label>标签<select id="tag"><option value="">全部标签</option></select></label>
<label>依赖<select id="dependency"><option value="">全部依赖</option></select></label>
<label>框架<select id="framework"><option value="">全部框架</option><option value="null">未知（未登记）</option></select></label>
<label>语言<select id="language"><option value="">全部语言</option><option value="null">未知（未登记）</option></select></label>
<label>样式<select id="styling"><option value="">全部样式</option><option value="null">未知（未登记）</option></select></label>
<label>类型<select id="assetKind"><option value="">全部类型</option><option value="source">源码登记</option><option value="reference">审美/交互参考</option></select></label>
<label>许可登记<select id="licenseStatus"><option value="">全部许可</option><option value="allowed">allowed</option><option value="unknown">unknown</option><option value="restricted">restricted</option></select></label>
<label>可取用登记<select id="availability"><option value="">全部登记</option><option value="source_snapshot">有源码快照（未实测恢复）</option><option value="registration_only">仅登记</option><option value="reference">审美/交互参考</option></select></label>
<button>搜索</button></form>
<p id="status" role="status">正在读取 catalog…</p><main><nav aria-label="组件列表" id="list"></nav><article id="detail"><h2>选择组件查看登记信息与源码</h2></article></main></body></html>
