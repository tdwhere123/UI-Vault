<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>切角表面样式图鉴</title><link rel="stylesheet" href="runtime.css"></head><body><main id="root"><header><p class="eyebrow">AUGMENTED-UI / CSS COMPONENT FAMILY</p><h1>不止于矩形</h1><p>固定原版 CSS 表面族，配本地图鉴控制器。不是上游完整应用，不模拟业务操作。</p></header><section class="controls" aria-label="样式控制"><label>角部尺寸 <input id="size" type="range" min="8" max="36" value="20"><output id="size-value">20 px</output></label><label>边框宽度 <input id="border" type="range" min="1" max="8" value="2"><output id="border-value">2 px</output></label><button id="reset">重置</button></section><section class="grid" aria-label="四种原样式"><article data-augmented-ui="tl-clip tr-clip br-clip bl-clip border inlay"><span>01 / CLIP</span><h2>切角</h2><p>原多边形裁切、边框及内衬。</p></article><article data-augmented-ui="tl-rect tr-rect br-rect bl-rect border inlay"><span>02 / RECT</span><h2>矩形切口</h2><p>原转折轮廓与形状变量。</p></article><article data-augmented-ui="tl-round tr-round br-round bl-round border inlay"><span>03 / ROUND</span><h2>圆弧</h2><p>原区域混合器的弧形角部。</p></article><article data-augmented-ui="tl-scoop tr-scoop br-scoop bl-scoop border inlay"><span>04 / SCOOP</span><h2>内凹</h2><p>原凹面几何，而非替代绘图。</p></article></section><footer>一族计一条，未覆盖全部混合器。实际裁切依赖浏览器 CSS 支持；无字体、图片或网络请求。</footer></main><script src="runtime.js"></script></body></html>
