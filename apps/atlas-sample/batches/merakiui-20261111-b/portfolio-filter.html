<!doctype html>
<html lang="zh-Hans" class="font-sans antialiased">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>作品筛选廊</title>
  <link rel="stylesheet" href="runtime.css">
</head>
<body data-demo="portfolio-filter">

    <section class="bg-white dark:bg-gray-900">
        <div class="container px-6 py-10 mx-auto">
            <h1 class="text-2xl font-semibold text-center text-gray-800 capitalize lg:text-3xl dark:text-white">Latest Work
            </h1>


            <div class="flex py-4 mt-4 overflow-x-auto overflow-y-hidden md:justify-center dark:border-gray-700">
                <button
                    class="h-12 px-8 py-2 -mb-px text-sm text-center text-blue-600 bg-transparent border-b-2 border-blue-500 sm:text-base dark:border-blue-400 dark:text-blue-300 whitespace-nowrap focus:outline-none">
                    Animation
                </button>

                <button
                    class="h-12 px-8 py-2 -mb-px text-sm text-center text-gray-700 bg-transparent border-b-2 border-gray-200 sm:text-base dark:text-white whitespace-nowrap cursor-base focus:outline-none dark:border-gray-700 dark:hover:border-gray-400 hover:border-gray-400">
                    Web design
                </button>

                <button
                    class="h-12 px-8 py-2 -mb-px text-sm text-center text-gray-700 bg-transparent border-b-2 border-gray-200 sm:text-base dark:text-white whitespace-nowrap cursor-base focus:outline-none dark:border-gray-700 dark:hover:border-gray-400 hover:border-gray-400">
                    App design
                </button>

                <button
                    class="h-12 px-8 py-2 -mb-px text-sm text-center text-gray-700 bg-transparent border-b-2 border-gray-200 sm:text-base dark:text-white whitespace-nowrap cursor-base focus:outline-none dark:border-gray-700 dark:hover:border-gray-400 hover:border-gray-400">
                    Branding
                </button>
            </div>

            <section class="mt-8 space-y-8 lg:mt-12">
                <section class="lg:flex lg:items-center">
                    <div class="lg:w-1/2 ">
                        <p class="text-lg tracking-wider text-blue-500 uppercase dark:text-blue-400 ">Ui kit</p>
                        <h2 class="mt-2 text-2xl font-semibold text-gray-800 capitalize dark:text-white">Block
                            of Ui kit collections</h2>
                    </div>

                    <div class="mt-4 lg:w-1/2 lg:mt-0">
                        <img class="object-cover w-full h-64 rounded-lg md:h-96"
                            src="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%271160%27%20height%3D%27800%27%20viewBox%3D%270%200%201160%20800%27%3E%3Crect%20width%3D%27100%25%27%20height%3D%27100%25%27%20fill%3D%27%23d6d3d1%27/%3E%3Ctext%20x%3D%2750%25%27%20y%3D%2750%25%27%20text-anchor%3D%27middle%27%20dominant-baseline%3D%27middle%27%20fill%3D%27%2344403c%27%20font-family%3D%27system-ui%2Csans-serif%27%20font-size%3D%2758%27%3Eportfolio-filter-1%3C/text%3E%3C/svg%3E"
                            alt="">
                    </div>
                </section>

                <section class="lg:flex lg:items-center">
                    <div class="lg:w-1/2 ">
                        <p class="text-lg tracking-wider text-blue-500 uppercase dark:text-blue-400 ">Wareframe</p>
                        <h2 class="mt-2 text-2xl font-semibold text-gray-800 capitalize dark:text-white">Best
                            free website layout </h2>
                    </div>

                    <div class="mt-4 lg:w-1/2 lg:mt-0">
                        <img class="object-cover w-full h-64 rounded-lg md:h-96"
                            src="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%271160%27%20height%3D%27800%27%20viewBox%3D%270%200%201160%20800%27%3E%3Crect%20width%3D%27100%25%27%20height%3D%27100%25%27%20fill%3D%27%23c7d2fe%27/%3E%3Ctext%20x%3D%2750%25%27%20y%3D%2750%25%27%20text-anchor%3D%27middle%27%20dominant-baseline%3D%27middle%27%20fill%3D%27%23312e81%27%20font-family%3D%27system-ui%2Csans-serif%27%20font-size%3D%2758%27%3Eportfolio-filter-2%3C/text%3E%3C/svg%3E"
                            alt="">
                    </div>
                </section>
            </section>
        </div>
    </section>
  <script src="runtime.js"></script>
</body>
</html>
