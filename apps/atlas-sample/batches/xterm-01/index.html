<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>只读 ANSI 日志回放</title><link rel="stylesheet" href="runtime.css"></head><body><main><header><small>EXODUS / LOCAL REPLAY</small><h1>读懂过程，不执行命令。</h1><p>真实 xterm.js 缓冲区 · 本地虚构记录 · 没有 Shell 或网络连接</p></header><section><div class="bar"><span class="dots">● ● ●</span><span>DEMO-042 · ANSI</span><output id="status"></output></div><div id="terminal"></div><div class="controls"><button id="play">播放</button><button id="pause">暂停</button><button id="step">单步</button><button id="reset">重置</button><span class="hint">覆盖进度行 / 擦除旧草稿 / 原生滚动缓冲区</span></div></section><div class="search"><label for="query">检索已回放内容</label><input id="query" maxlength="80" value="citation" autocomplete="off"><button id="prev">上一个</button><button id="next">下一个</button><output id="result" aria-live="polite"></output></div><footer>原创界面壳＋原 xterm.js 渲染与 SearchAddon。只读、禁止剪贴板及链接打开，不连接真实终端。视觉效果未验收。</footer></main><script src="runtime.js"></script></body></html>
