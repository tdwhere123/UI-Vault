<!doctype html>
<html lang="en" class="font-sans antialiased">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>选择账户登录</title>
  <link rel="stylesheet" href="runtime.css">
</head>
<body data-demo="sign-in-select-user">

    <section class="bg-white dark:bg-gray-900">
        <div class="container flex flex-col items-center justify-center min-h-screen px-6 mx-auto">
            <div class="flex justify-center mx-auto">
                <img class="w-auto h-7 sm:h-8" src="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%271160%27%20height%3D%27800%27%20viewBox%3D%270%200%201160%20800%27%3E%3Crect%20width%3D%27100%25%27%20height%3D%27100%25%27%20fill%3D%27%23d6d3d1%27/%3E%3Ctext%20x%3D%2750%25%27%20y%3D%2750%25%27%20text-anchor%3D%27middle%27%20dominant-baseline%3D%27middle%27%20fill%3D%27%2344403c%27%20font-family%3D%27system-ui%2Csans-serif%27%20font-size%3D%2758%27%3Esign-in-select-user-1%3C/text%3E%3C/svg%3E" alt="">
            </div>

            <h1 class="mt-4 text-2xl font-semibold tracking-wide text-center text-gray-800 capitalize md:text-3xl dark:text-white">
                welcome Back
            </h1>

            <div class="flex items-center mt-6">
                <p class="text-gray-500 dark:text-gray-400">continue as</p>

                <div class="flex items-center mx-2">
                    <img class="object-cover w-8 h-8 mx-1 rounded-full" src="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%271160%27%20height%3D%27800%27%20viewBox%3D%270%200%201160%20800%27%3E%3Crect%20width%3D%27100%25%27%20height%3D%27100%25%27%20fill%3D%27%23c7d2fe%27/%3E%3Ctext%20x%3D%2750%25%27%20y%3D%2750%25%27%20text-anchor%3D%27middle%27%20dominant-baseline%3D%27middle%27%20fill%3D%27%23312e81%27%20font-family%3D%27system-ui%2Csans-serif%27%20font-size%3D%2758%27%3Esign-in-select-user-2%3C/text%3E%3C/svg%3E" alt="">
                    <span class="mx-1 text-gray-800 dark:text-white">Ana Williams...</span>
                </div>

                <button class="text-blue-500 dark:text-blue-400 focus:outline-none hover:underline">change</button>
            </div>

            <div class="w-full max-w-md mx-auto mt-6">
                <form>
                    <div>
                        <label class="block mb-2 text-sm text-gray-600 dark:text-gray-200">Password</label>
                        <input type="password" placeholder="Enter your password" class="block w-full px-5 py-3 mt-2 text-gray-700 placeholder-gray-400 bg-white border border-gray-200 rounded-lg dark:placeholder-gray-600 dark:bg-gray-900 dark:text-gray-300 dark:border-gray-700 focus:border-blue-400 dark:focus:border-blue-400 focus:ring-blue-400 focus:outline-none focus:ring focus:ring-opacity-40" />
                    </div>

                    <a href="#" class="inline-block mt-4 text-blue-500 capitalize hover:underline dark:text-blue-400">
                        reset password?
                    </a>

                    <button class="w-full px-6 py-3 mt-4 text-sm font-medium tracking-wide text-white capitalize transition-colors duration-300 transform bg-blue-500 rounded-lg hover:bg-blue-400 focus:outline-none focus:ring focus:ring-blue-300 focus:ring-opacity-50">
                        “Continue”
                    </button>

                    <div class="mt-6 text-center">
                        <a href="#" class="text-sm text-blue-500 hover:underline dark:text-blue-400">
                            Don’t have an account yet? Sign up
                        </a>
                    </div>

                    <p class="mt-6 text-gray-500 dark:text-gray-400">
                        By clicking “Continue” above, you acknowledge that you have read and
                        understood, and agree to Our <a href="#" class="text-gray-700 dark:text-white">Term & Conditions</a>
                        and<a href="#" class="text-gray-700 dark:text-white"> Privacy Policy.</a>
                    </p>
                </form>
            </div>
        </div>
    </section>
  <script src="runtime.js"></script>
</body>
</html>
