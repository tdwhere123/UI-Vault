<!doctype html>
<html lang="en" class="font-sans antialiased">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>横向图片轮播</title>
  <link rel="stylesheet" href="runtime.css">
</head>
<body class="min-h-screen" data-demo="carousel-1">
<div class="relative flex items-center justify-center w-full text-gray-900">
	<button
		aria-label="Slide back"
		type="button"
	 class="absolute left-0 z-30 p-2 ml-10 bg-opacity-50 rounded-full focus:outline-none focus:bg-gray-400 focus:ring-2 focus:ring-offset-2 focus:ring-gray-400 bg-gray-50"
	>
		<svg
			class="w-4 h-4"
			width="8"
			height="14"
			fill="none"
			viewBox="0 0 8 14"
			xmlns="http://www.w3.org/2000/svg"
		>
			<path
				d="M7 1L1 7L7 13"
				stroke="currentColor"
				stroke-width="2"
				stroke-linecap="round"
				stroke-linejoin="round"
			/>
		</svg>
	</button>
	<div
		class="flex items-center justify-start w-full h-full gap-6 py-4 mx-auto overflow-auto lg:gap-8"
	>
		<div class="relative flex flex-shrink-0 w-full sm:w-auto">
			<img
				src="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%271160%27%20height%3D%27800%27%20viewBox%3D%270%200%201160%20800%27%3E%3Crect%20width%3D%27100%25%27%20height%3D%27100%25%27%20fill%3D%27%23d6d3d1%27/%3E%3Ctext%20x%3D%2750%25%27%20y%3D%2750%25%27%20text-anchor%3D%27middle%27%20dominant-baseline%3D%27middle%27%20fill%3D%27%2344403c%27%20font-family%3D%27system-ui%2Csans-serif%27%20font-size%3D%2758%27%3Ecarousel-1-1%3C/text%3E%3C/svg%3E"
				alt="Image 1"
				class="object-cover object-center bg-gray-500 h-96 aspect-square"
			/>
		</div><div class="relative flex flex-shrink-0 w-full sm:w-auto">
			<img
				src="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%271160%27%20height%3D%27800%27%20viewBox%3D%270%200%201160%20800%27%3E%3Crect%20width%3D%27100%25%27%20height%3D%27100%25%27%20fill%3D%27%23e7e5e4%27/%3E%3Ctext%20x%3D%2750%25%27%20y%3D%2750%25%27%20text-anchor%3D%27middle%27%20dominant-baseline%3D%27middle%27%20fill%3D%27%2357534e%27%20font-family%3D%27system-ui%2Csans-serif%27%20font-size%3D%2758%27%3Ecarousel-1-2%3C/text%3E%3C/svg%3E"
				alt="Image 2"
				class="object-cover object-center bg-gray-500 h-96 aspect-square"
			/>
		</div><div class="relative flex flex-shrink-0 w-full sm:w-auto">
			<img
				src="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%271160%27%20height%3D%27800%27%20viewBox%3D%270%200%201160%20800%27%3E%3Crect%20width%3D%27100%25%27%20height%3D%27100%25%27%20fill%3D%27%23dbeafe%27/%3E%3Ctext%20x%3D%2750%25%27%20y%3D%2750%25%27%20text-anchor%3D%27middle%27%20dominant-baseline%3D%27middle%27%20fill%3D%27%231e3a8a%27%20font-family%3D%27system-ui%2Csans-serif%27%20font-size%3D%2758%27%3Ecarousel-1-3%3C/text%3E%3C/svg%3E"
				alt="Image 3"
				class="object-cover object-center bg-gray-500 h-96 aspect-square"
			/>
		</div><div class="relative flex flex-shrink-0 w-full sm:w-auto">
			<img
				src="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%271160%27%20height%3D%27800%27%20viewBox%3D%270%200%201160%20800%27%3E%3Crect%20width%3D%27100%25%27%20height%3D%27100%25%27%20fill%3D%27%23dcfce7%27/%3E%3Ctext%20x%3D%2750%25%27%20y%3D%2750%25%27%20text-anchor%3D%27middle%27%20dominant-baseline%3D%27middle%27%20fill%3D%27%2314532d%27%20font-family%3D%27system-ui%2Csans-serif%27%20font-size%3D%2758%27%3Ecarousel-1-4%3C/text%3E%3C/svg%3E"
				alt="Image 4"
				class="object-cover object-center bg-gray-500 h-96 aspect-square"
			/>
		</div><div class="relative flex flex-shrink-0 w-full sm:w-auto">
			<img
				src="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%271160%27%20height%3D%27800%27%20viewBox%3D%270%200%201160%20800%27%3E%3Crect%20width%3D%27100%25%27%20height%3D%27100%25%27%20fill%3D%27%23fce7f3%27/%3E%3Ctext%20x%3D%2750%25%27%20y%3D%2750%25%27%20text-anchor%3D%27middle%27%20dominant-baseline%3D%27middle%27%20fill%3D%27%239d174d%27%20font-family%3D%27system-ui%2Csans-serif%27%20font-size%3D%2758%27%3Ecarousel-1-5%3C/text%3E%3C/svg%3E"
				alt="Image 5"
				class="object-cover object-center bg-gray-500 h-96 aspect-square"
			/>
		</div>
	</div>
	<button
		aria-label="Slide forward"
	 class="absolute right-0 z-30 p-2 mr-10 bg-opacity-50 rounded-full focus:outline-none focus:bg-gray-400 focus:ring-2 focus:ring-offset-2 focus:ring-gray-400 bg-gray-50"
		id="next"
	>
		<svg
			class="w-4 h-4"
			width="8"
			height="14"
			viewBox="0 0 8 14"
			fill="none"
			xmlns="http://www.w3.org/2000/svg"
		>
			<path
				d="M1 1L7 7L1 13"
				stroke="currentColor"
				stroke-width="2"
				stroke-linecap="round"
				stroke-linejoin="round"
			/>
		</svg>
	</button>
</div>
  <script src="runtime.js"></script>
</body>
</html>
