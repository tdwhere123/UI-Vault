<!doctype html>
<html lang="en" class="font-sans antialiased">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>多日天气预报</title>
  <link rel="stylesheet" href="runtime.css">
</head>
<body class="min-h-screen" data-demo="weather-3">
<div
 class="max-w-xs overflow-hidden rounded-lg shadow-lg bg-gray-50 text-gray-800"
>
	<div
		class="flex items-end justify-end h-32 p-4 bg-gray-500 bg-center bg-cover"
		style="background-image: url(data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%271160%27%20height%3D%27800%27%20viewBox%3D%270%200%201160%20800%27%3E%3Crect%20width%3D%27100%25%27%20height%3D%27100%25%27%20fill%3D%27%23d6d3d1%27/%3E%3Ctext%20x%3D%2750%25%27%20y%3D%2750%25%27%20text-anchor%3D%27middle%27%20dominant-baseline%3D%27middle%27%20fill%3D%27%2344403c%27%20font-family%3D%27system-ui%2Csans-serif%27%20font-size%3D%2758%27%3Eweather-3-1%3C/text%3E%3C/svg%3E"
	>
		<p
			class="px-2 py-1 text-sm tracking-widest text-gray-100 uppercase bg-gray-800 bg-opacity-75 rounded shadow-lg"
		>
			Miami
		</p>
	</div>
	<div class="flex justify-between p-4">
		<div class="flex flex-col flex-1 gap-4">
			<div class="flex justify-between">
				<div class="flex gap-2">
					<span class="text-5xl font-semibold">36°</span>
					<span class="text-lg text-gray-600">/ 28°</span>
				</div>
				<svg
					xmlns="http://www.w3.org/2000/svg"
					viewBox="0 0 512 512"
					class="w-12 h-12 text-yellow-400 fill-current shrink-0"
				>
					<path
						d="M256,104c-83.813,0-152,68.187-152,152s68.187,152,152,152,152-68.187,152-152S339.813,104,256,104Zm0,272A120,120,0,1,1,376,256,120.136,120.136,0,0,1,256,376Z"
					/>
					<rect width="32" height="48" x="240" y="16" />
					<rect width="32" height="48" x="240" y="448" />
					<rect width="48" height="32" x="448" y="240" />
					<rect width="48" height="32" x="16" y="240" />
					<rect
						width="32"
						height="45.255"
						x="400"
						y="393.373"
						transform="rotate(-45 416 416)"
					/>
					<rect
						width="32.001"
						height="45.255"
						x="80"
						y="73.373"
						transform="rotate(-45 96 96)"
					/>
					<rect
						width="45.255"
						height="32"
						x="73.373"
						y="400"
						transform="rotate(-45.001 96.002 416.003)"
					/>
					<rect
						width="45.255"
						height="32.001"
						x="393.373"
						y="80"
						transform="rotate(-45 416 96)"
					/>
				</svg>
			</div>
			<p class="text-sm">
				Mostly sunny throughout the day.
				<br />
				6-10 KPH winds.
			</p>
		</div>
		<div class="text-sm leading-loose">
			<div class="flex items-center"></div>
		</div>
	</div>
	<div
	 class="flex items-center justify-between gap-8 p-4 border-t text-gray-600 border-gray-300"
	>
		<div class="flex items-center space-x-1">
			<span class="font-bold">8</span>
			<span class="text-sm">UV</span>
		</div>
		<div class="flex items-center space-x-1">
			<span class="font-bold">5%</span>
			<span class="text-sm">Precip</span>
		</div>
		<div class="flex items-center space-x-1">
			<span class="font-bold">14°</span>
			<span class="text-sm">Dew Point</span>
		</div>
	</div>
</div>
  <script src="runtime.js"></script>
</body>
</html>
