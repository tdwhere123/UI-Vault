<!doctype html>
<html lang="en" class="font-sans antialiased">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>卡片联系表单</title>
  <link rel="stylesheet" href="runtime.css">
</head>
<body class="min-h-screen" data-demo="contact-3">
<section class="p-6 text-gray-800">
	<form
	 class="container w-full max-w-xl p-8 mx-auto space-y-6 rounded-md shadow bg-gray-50"
	>
		<h2 class="w-full text-3xl font-bold leading-tight">Contact us</h2>

		<div>
			<label for="name" class="block mb-1 ml-1">Name</label>
			<input
			 class="block w-full p-2 rounded focus:outline-none focus:ring focus:ring-opacity-25 focus:ring-violet-600 bg-gray-100"
				id="name"
				type="text"
				placeholder="Your name"
				required
			/>
		</div>

		<div>
			<label for="email" class="block mb-1 ml-1">Email</label>
			<input
			 class="block w-full p-2 rounded focus:outline-none focus:ring focus:ring-opacity-25 focus:ring-violet-600 bg-gray-100"
				id="email"
				type="email"
				placeholder="Your email"
				required
			/>
		</div>

		<div>
			<label for="message" class="block mb-1 ml-1">Message</label>
			<textarea
			 class="block w-full p-2 rounded autoexpand focus:outline-none focus:ring focus:ring-opacity-25 focus:ring-violet-600 bg-gray-100"
				id="message"
				type="text"
				placeholder="Message..."
			></textarea>
		</div>

		<div class="">
			<button
			 class="w-full px-4 py-2 font-bold rounded shadow focus:outline-none focus:ring hover:ring focus:ring-opacity-50 bg-violet-600 focus:ring-violet-600 hover:ring-violet-600 text-gray-50"
				type="submit"
			>
				Send
			</button>
		</div>
	</form>
</section>
  <script src="runtime.js"></script>
</body>
</html>
