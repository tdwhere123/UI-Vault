<!doctype html>
<html lang="en" class="font-sans antialiased">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>分段资料表单</title>
  <link rel="stylesheet" href="runtime.css">
</head>
<body class="min-h-screen" data-demo="form-1">
<section class="p-6 bg-gray-100 text-gray-900">
	<form action="" class="container flex flex-col mx-auto space-y-12">
		<fieldset
		 class="grid grid-cols-4 gap-6 p-6 rounded-md shadow-sm bg-gray-50"
		>
			<div class="space-y-2 col-span-full lg:col-span-1">
				<p class="font-medium">Personal Inormation</p>
				<p class="text-xs">
					Lorem ipsum dolor sit, amet consectetur adipisicing elit. Adipisci fuga autem
					eum!
				</p>
			</div>
			<div class="grid grid-cols-6 gap-4 col-span-full lg:col-span-3">
				<div class="col-span-full sm:col-span-3">
					<label class="text-sm" for="firstname">First name</label>
					<input
						id="firstname"
						type="text"
					 class="w-full rounded-md focus:ring focus:ring-opacity-75 text-custom-dark focus:ring-violet-600 border-gray-300"
						placeholder="First name"
					/>
				</div>
				<div class="col-span-full sm:col-span-3">
					<label class="text-sm" for="lastname">Last name</label>
					<input
						id="lastname"
						type="text"
					 class="w-full rounded-md focus:ring focus:ring-opacity-75 text-custom-dark focus:ring-violet-600 border-gray-300"
						placeholder="Last name"
					/>
				</div>
				<div class="col-span-full sm:col-span-3">
					<label class="text-sm" for="email">Email</label>
					<input
						id="email"
						type="email"
					 class="w-full rounded-md focus:ring focus:ring-opacity-75 text-custom-dark focus:ring-violet-600 border-gray-300"
						placeholder="Email"
					/>
				</div>

				<div class="col-span-full">
					<label class="text-sm" for="address">Address</label>
					<input
						id="address"
						type="text"
					 class="w-full rounded-md focus:ring focus:ring-opacity-75 text-custom-dark focus:ring-violet-600 border-gray-300"
						placeholder=""
					/>
				</div>
				<div class="col-span-full sm:col-span-2">
					<label class="text-sm" for="city">City</label>
					<input
						id="city"
						type="text"
					 class="w-full rounded-md focus:ring focus:ring-opacity-75 text-custom-dark focus:ring-violet-600 border-gray-300"
						placeholder=""
					/>
				</div>
				<div class="col-span-full sm:col-span-2">
					<label class="text-sm" for="state">State / Province</label>
					<input
						id="state"
						type="text"
					 class="w-full rounded-md focus:ring focus:ring-opacity-75 text-custom-dark focus:ring-violet-600 border-gray-300"
						placeholder=""
					/>
				</div>
				<div class="col-span-full sm:col-span-2">
					<label class="text-sm" for="zip">ZIP / Postal</label>
					<input
						id="zip"
						type="text"
					 class="w-full rounded-md focus:ring focus:ring-opacity-75 text-custom-dark focus:ring-violet-600 border-gray-300"
						placeholder=""
					/>
				</div>
			</div>
		</fieldset>
		<fieldset
		 class="grid grid-cols-4 gap-6 p-6 rounded-md shadow-sm bg-gray-50"
		>
			<div class="space-y-2 col-span-full lg:col-span-1">
				<p class="font-medium">Profile</p>
				<p class="text-xs">Adipisci fuga autem eum!</p>
			</div>
			<div class="grid grid-cols-6 gap-4 col-span-full lg:col-span-3">
				<div class="col-span-full sm:col-span-3">
					<label class="text-sm" for="username">Username</label>
					<input
						id="username"
						type="text"
					 class="w-full rounded-md focus:ring focus:ring-opacity-75 text-custom-dark focus:ring-violet-600 border-gray-300"
						placeholder="Username"
					/>
				</div>
				<div class="col-span-full sm:col-span-3">
					<label class="text-sm" for="website">Website</label>
					<input
						id="website"
						type="text"
					 class="w-full rounded-md focus:ring focus:ring-opacity-75 text-custom-dark focus:ring-violet-600 border-gray-300"
						placeholder="https://"
					/>
				</div>
				<div class="col-span-full">
					<label class="text-sm" for="bio">Bio</label>
					<textarea
						id="bio"
					 class="w-full rounded-md focus:ring focus:ring-opacity-75 text-custom-dark focus:ring-violet-600 border-gray-300"
						placeholder=""
					></textarea>
				</div>
				<div class="col-span-full">
					<label class="text-sm" for="bio">Photo</label>
					<div class="flex items-center space-x-2">
						<img
							src="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%271160%27%20height%3D%27800%27%20viewBox%3D%270%200%201160%20800%27%3E%3Crect%20width%3D%27100%25%27%20height%3D%27100%25%27%20fill%3D%27%23d6d3d1%27/%3E%3Ctext%20x%3D%2750%25%27%20y%3D%2750%25%27%20text-anchor%3D%27middle%27%20dominant-baseline%3D%27middle%27%20fill%3D%27%2344403c%27%20font-family%3D%27system-ui%2Csans-serif%27%20font-size%3D%2758%27%3Eform-1-1%3C/text%3E%3C/svg%3E"
							alt=""
						 class="w-10 h-10 bg-gray-500 rounded-full bg-gray-300"
						/>
						<button
							type="button"
						 class="px-4 py-2 border rounded-md border-gray-800"
						>
							Change
						</button>
					</div>
				</div>
			</div>
		</fieldset>
	</form>
</section>
  <script src="runtime.js"></script>
</body>
</html>
