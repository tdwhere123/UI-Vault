<body class="bg-background" data-demo="flyout-shop">
<div class="flex items-center justify-center w-full p-8 pb-145.5 mx-auto bg-background"><!-- copy:start --><div class="relative z-50 isolate" x-data="{
      uid: Math.random().toString(36).slice(2),
  // Set to true to show the flyout open by default. Change to false to have it closed by default.
  open: true,
      style: '',
      gap: 8,
      align() {
        const r = this.$refs.btn.getBoundingClientRect();
        const top = r.bottom + this.gap;              // full-width, just under button
        this.style = `position:fixed; left:0; right:0; top:${top}px;`;
      },
      toggle() {
        if (this.open) { this.open = false; return; }
        window.dispatchEvent(new CustomEvent('close-all-flyouts', { detail: this.uid }));
        this.align();                                  // compute coords first
        requestAnimationFrame(() =&gt; this.open = true); // then show (no jitter)
      },
      close() { this.open = false; }
    }" x-init="
      window.addEventListener('close-all-flyouts', (e) =&gt; { if (e.detail !== uid) open = false });
      const realign = () =&gt; { if (open) align() };
      window.addEventListener('resize', realign);
      window.addEventListener('scroll', realign, { passive: true });
      // If open by default, align immediately
      if (open) align();
    "><div class="flex items-center justify-center px-8 mx-auto max-w-7xl md:px-12 lg:px-24"><button class="relative flex items-center justify-center text-center font-medium transition-colors duration-200 ease-in-out select-none focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:z-10 justify-center rounded-md text-muted-foreground bg-muted outline outline-border hover:opacity-90 focus-visible:outline-border h-9 px-4 text-sm gap-2.5" x-ref="btn" aria-expanded="false" @click.stop="toggle"><span>Button</span><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler-chevron-down size-4" slot="right-icon"><path stroke="none" d="M0 0h24v24H0z" fill="none"></path><path d="M6 9l6 6l6 -6"></path></svg></button></div><!-- Backdrop (outside click) --><div x-show="open" x-transition.opacity class="fixed inset-0 z-[999]" @click="close" style="display:none"></div><!-- Teleported full-width flyout --><template x-teleport="body"><div x-show="open" :style="style" class="z-[1000] bg-background shadow-lg outline outline-border/10" style="display:none" @keydown.escape.window="close" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 -translate-y-1" x-transition:enter-end="opacity-100 translate-y-0" x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100 translate-y-0" x-transition:leave-end="opacity-0 -translate-y-1"><div class="px-8 py-8 mx-auto max-w-7xl md:px-12 lg:px-24"><div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-x-8 gap-y-12"><div><h3 class="text-base font-medium text-foreground">Browse by category</h3><div class="pt-4 mt-4 border-t border-border space-y-2" role="none"><a class="text-base block font-medium hover:text-muted-foreground" href="#">New Arrivals</a><a class="text-base block font-medium hover:text-muted-foreground" href="#">Best Sellers</a><a class="text-base block font-medium hover:text-muted-foreground" href="#">Seasonal Favorites</a><a class="text-base block font-medium hover:text-muted-foreground" href="#">Exclusive Collections</a><a class="text-base block font-medium hover:text-muted-foreground" href="#">Trending Styles</a><a class="text-base block font-medium hover:text-muted-foreground" href="#">Sale Items</a><a class="text-base block font-medium hover:text-muted-foreground" href="#">Limited Edition</a></div></div><div><h3 class="text-base font-medium text-foreground">Shop by feature</h3><div class="pt-4 mt-4 border-t border-border space-y-2" role="none"><a class="text-base block font-medium hover:text-muted-foreground" href="#">Free Shipping</a><a class="text-base block font-medium hover:text-muted-foreground" href="#">Sustainable Materials</a><a class="text-base block font-medium hover:text-muted-foreground" href="#">Custom Sizing</a><a class="text-base block font-medium hover:text-muted-foreground" href="#">Gift Cards</a><a class="text-base block font-medium hover:text-muted-foreground" href="#">Style Guides</a><a class="text-base block font-medium hover:text-muted-foreground" href="#">Personal Stylist</a><a class="text-base block font-medium hover:text-muted-foreground" href="#">Loyalty Program</a></div></div><div><h3 class="text-base font-medium text-foreground">Men&#39;s Collection</h3><div class="pt-4 mt-4 border-t border-border space-y-2" role="none"><a class="text-base block font-medium hover:text-muted-foreground" href="#">Casual Wear</a><a class="text-base block font-medium hover:text-muted-foreground" href="#">Formal Wear</a><a class="text-base block font-medium hover:text-muted-foreground" href="#">Sportswear</a><a class="text-base block font-medium hover:text-muted-foreground" href="#">Footwear</a><a class="text-base block font-medium hover:text-muted-foreground" href="#">Accessories</a><a class="text-base block font-medium hover:text-muted-foreground" href="#">Outerwear</a><a class="text-base block font-medium hover:text-muted-foreground" href="#">Activewear</a></div></div><div><h3 class="text-base font-medium text-foreground">Women&#39;s Collection</h3><div class="pt-4 mt-4 border-t border-border space-y-2" role="none"><a class="text-base block font-medium hover:text-muted-foreground" href="#">Dresses</a><a class="text-base block font-medium hover:text-muted-foreground" href="#">Tops &amp; Blouses</a><a class="text-base block font-medium hover:text-muted-foreground" href="#">Bottoms</a><a class="text-base block font-medium hover:text-muted-foreground" href="#">Shoes</a><a class="text-base block font-medium hover:text-muted-foreground" href="#">Jewelry &amp; Accessories</a><a class="text-base block font-medium hover:text-muted-foreground" href="#">Outerwear</a><a class="text-base block font-medium hover:text-muted-foreground" href="#">Activewear</a></div></div></div><div class="items-end p-8 mt-12 shadow grid grid-cols-1 gap-4 sm:grid-cols-2 bg-linear-180 outline outline-border from-muted to-background rounded-xl"><div><h3 class="text-lg md:text-xl  font-semibold text-foreground">Discover your perfect style</h3><p class="text-base mt-4 font-medium text-muted-foreground lg:text-balance">Explore the latest trends and effortlessly shop exclusive collections, all while enjoying a personalized shopping experience tailored just for you</p></div><div class="flex flex-col items-center gap-2 lg:flex-row sm:ml-auto"><button class="relative flex items-center justify-center text-center font-medium transition-colors duration-200 ease-in-out select-none focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:z-10 justify-center rounded-md text-background bg-foreground outline outline-foreground hover:opacity-90 focus-visible:outline-border h-9 px-4 text-sm">Get started</button><button class="relative flex items-center justify-center text-center font-medium transition-colors duration-200 ease-in-out select-none focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:z-10 justify-center rounded-md text-muted-foreground bg-muted outline outline-border hover:opacity-90 focus-visible:outline-border h-9 px-4 text-sm">Learn more</button></div></div></div></div></template></div><!-- copy:end --></div>
