<!doctype html>
<html lang="zh-Hans" class="font-sans antialiased">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>带预览的搜索命令条</title>
  <link rel="stylesheet" href="runtime.css">
</head>
<body class="bg-background" data-demo="commandbar-05">
<!--

  - [x-cloak] hides uninitialized Alpine content until hydration to avoid flicker.
 

--><div class="w-full max-w-4xl overflow-hidden bg-background shadow-lg rounded-xl outline outline-border" x-data="{
      open: true,
      query: '',
      active: 'all', // all | files | people | updates
      selected: 0,
      copied: false,
      onlyPinned: false,
      // Data
      items: [
        { id: 'f-1', kind: 'files', title: 'Product Roadmap Q4', subtitle: 'Docs / Strategy', badges:['Doc','Internal'], href:'#file-1' },
        { id: 'f-2', kind: 'files', title: 'Release Checklist', subtitle: 'Docs / Delivery', badges:['Checklist'], href:'#file-2' },
        { id: 'p-1', kind: 'people', title: 'Akira Watanabe', subtitle: 'Design Systems', badges:['Manager'], href:'#user-1' },
        { id: 'p-2', kind: 'people', title: 'Maya Singh', subtitle: 'Developer Experience', badges:['Reviewer'], href:'#user-2' },
        { id: 'u-1', kind: 'updates', title: 'Incident 482 resolved', subtitle: 'Database latency back to normal', badges:['Postmortem'], href:'#upd-1' },
        { id: 'u-2', kind: 'updates', title: 'Sprint 21 planning notes', subtitle: 'Next steps and owners', badges:['Planning'], href:'#upd-2' },
      ],
      recents: ['f-1','p-2','u-1'],
      pinned: new Set(),
      // Helpers
      init(){ try{ const raw=localStorage.getItem('oxbow-cmd5-pins'); if(raw) this.pinned=new Set(JSON.parse(raw)); }catch{} },
      savePins(){ try{ localStorage.setItem('oxbow-cmd5-pins', JSON.stringify(Array.from(this.pinned))); }catch{} },
      togglePin(id){ this.pinned.has(id) ? this.pinned.delete(id) : this.pinned.add(id); this.savePins(); },
      score(text,q){ q=(q||'').trim().toLowerCase(); if(!q) return 1; text=(text||'').toLowerCase(); if(text===q) return 1000; if(text.startsWith(q)) return 500; let i=0,j=0; while(i&lt;text.length&amp;&j&lt;q.length){ if(text[i]===q[j]) j++; i++; } return j===q.length?200:(text.includes(q)?100:-1); },
      filtered(){
        const q=this.query, tab=this.active;
        return this.items
          .filter(it=&gt; tab==='all' ? true : it.kind===tab)
          .map(it=&gt;({it, s: Math.max(this.score(it.title,q), this.score(it.subtitle,q))}))
          .filter(x=&gt; x.s&gt;=0)
          .filter(x=&gt; this.onlyPinned ? this.pinned.has(x.it.id) : true)
          .sort((a,b)=&gt;{
            // Prefer pinned, then recents, then score
            const ap = this.pinned.has(a.it.id) ? 1 : 0;
            const bp = this.pinned.has(b.it.id) ? 1 : 0;
            if(ap!==bp) return bp-ap;
            const ar = this.recents.includes(a.it.id) ? 1 : 0;
            const br = this.recents.includes(b.it.id) ? 1 : 0;
            if(ar!==br) return br-ar;
            return b.s - a.s;
          })
          .map(x=&gt;x.it);
      },
      rows(){ return this.filtered().map(r=&gt;`row:${r.id}`); },
      next(){ const n=this.rows().length; if(!n) return; this.selected=(this.selected+1)%n; },
      prev(){ const n=this.rows().length; if(!n) return; this.selected=(this.selected-1+n)%n; },
      isSel(id){ return this.rows()[this.selected]===`row:${id}`; },
      current(){ const ids=this.rows(); const key=ids[this.selected]; const id=(key||'').replace('row:',''); return this.items.find(i=&gt;i.id===id) || null; },
      choose(){ const c=this.current(); if(!c) return; window.location.hash=c.href; this.open=false; },
      copy(){ const c=this.current(); if(!c) return; const txt=window.location.origin+window.location.pathname+c.href; navigator.clipboard.writeText(txt).catch(()=&gt;{}); this.copied=true; setTimeout(()=&gt; this.copied=false, 900); },
      onKey(e){
        if((e.metaKey||e.ctrlKey)&amp;&amp;!e.shiftKey&amp;&amp;!e.altKey&amp;&e.key.toLowerCase()==='k'){ e.preventDefault(); this.open=true; this.$nextTick(()=&gt; this.$refs.input?.focus()); }
        if(e.key==='/'){ e.preventDefault(); this.open=true; this.$nextTick(()=&gt; this.$refs.input?.focus()); }
        if(!this.open) return;
        if(e.key==='Escape'){ this.open=false; return; }
        if(e.metaKey &amp;&amp; !e.shiftKey &amp;&amp; !e.altKey &amp;&amp; e.key.toLowerCase()==='c'){ e.preventDefault(); this.copy(); }
        if(e.metaKey &amp;&amp; !e.shiftKey &amp;&amp; !e.altKey &amp;&amp; e.key.toLowerCase()==='p'){ e.preventDefault(); const cur=this.current(); if(cur) this.togglePin(cur.id); }
        if(e.key==='ArrowDown'){ e.preventDefault(); this.next(); }
        if(e.key==='ArrowUp'){ e.preventDefault(); this.prev(); }
        if(e.key==='Enter'){ e.preventDefault(); this.choose(); }
      }
    }" @keydown.window="onKey($event)"><!-- Header: search + tabs + filters --><div class="p-2"><div class="relative"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler-arrow-search size-5 pointer-events-none absolute top-3.5 left-4 text-muted-foreground" slot="icon"><path stroke="none" d="M0 0h24v24H0z" fill="none"></path><path d="M10 10m-7 0a7 7 0 1 0 14 0a7 7 0 1 0 -14 0"></path><path d="M21 21l-6 -6"></path></svg><input x-ref="input" x-model="query" class="w-full h-12 bg-transparent border-0 rounded-lg pr-36 text-foreground placeholder:text-muted-foreground pl-11 sm:text-sm ring-1 ring-border focus:outline-none focus:ring-2 focus:ring-border" placeholder="Search files, people and updates…" autocomplete="off"><div class="pointer-events-none absolute right-2 top-1/2 -translate-y-1/2 hidden sm:flex gap-1 text-[0.70rem] text-muted-foreground"><kbd class="px-1 border rounded bg-background border-border">⌘</kbd><kbd class="px-1 border rounded bg-background border-border">K</kbd></div><button type="button" x-show="query.length&gt;0" @click="query=''; $nextTick(()=&gt; $refs.input?.focus())" class="absolute right-[4.5rem] top-1/2 -translate-y-1/2 size-7 inline-flex items-center justify-center rounded-md text-muted-foreground hover:text-muted-foreground hover:bg-background/10" aria-label="Clear search"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler-wave-x size-4"><path stroke="none" d="M0 0h24v24H0z" fill="none"></path><path d="M18 6l-12 12"></path><path d="M6 6l12 12"></path></svg></button></div><div class="mt-2 px-2 flex items-center justify-between text-[12px]"><div class="flex items-center gap-2"><button @click="active='all'; selected=0" :class="active==='all' ? 'text-foreground' : 'text-muted-foreground'" class="inline-flex items-center px-2 py-1 rounded-md hover:bg-background/5 gap-2"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler-report size-4"><path stroke="none" d="M0 0h24v24H0z" fill="none"></path><path d="M8 5h-2a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h5.697"></path><path d="M18 14v4h4"></path><path d="M18 11v-4a2 2 0 0 0 -2 -2h-2"></path><path d="M8 3m0 2a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v0a2 2 0 0 1 -2 2h-2a2 2 0 0 1 -2 -2z"></path><path d="M18 18m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0"></path><path d="M8 11h4"></path><path d="M8 15h3"></path></svg><span class="hidden sm:inline">All</span></button><button @click="active='files'; selected=0" :class="active==='files' ? 'text-foreground' : 'text-muted-foreground'" class="inline-flex items-center px-2 py-1 rounded-md hover:bg-background/5 gap-2"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler-external-file-dots size-4"><path stroke="none" d="M0 0h24v24H0z" fill="none"></path><path d="M14 3v4a1 1 0 0 0 1 1h4"></path><path d="M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2z"></path><path d="M9 14v.01"></path><path d="M12 14v.01"></path><path d="M15 14v.01"></path></svg><span class="hidden sm:inline">Files</span></button><button @click="active='people'; selected=0" :class="active==='people' ? 'text-foreground' : 'text-muted-foreground'" class="inline-flex items-center px-2 py-1 rounded-md hover:bg-background/5 gap-2"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler-layout-users-group size-4"><path stroke="none" d="M0 0h24v24H0z" fill="none"></path><path d="M10 13a2 2 0 1 0 4 0a2 2 0 0 0 -4 0"></path><path d="M8 21v-1a2 2 0 0 1 2 -2h4a2 2 0 0 1 2 2v1"></path><path d="M15 5a2 2 0 1 0 4 0a2 2 0 0 0 -4 0"></path><path d="M17 10h2a2 2 0 0 1 2 2v1"></path><path d="M5 5a2 2 0 1 0 4 0a2 2 0 0 0 -4 0"></path><path d="M3 13v-1a2 2 0 0 1 2 -2h2"></path></svg><span class="hidden sm:inline">People</span></button><button @click="active='updates'; selected=0" :class="active==='updates' ? 'text-foreground' : 'text-muted-foreground'" class="inline-flex items-center px-2 py-1 rounded-md hover:bg-background/5 gap-2"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler-report size-4"><path stroke="none" d="M0 0h24v24H0z" fill="none"></path><path d="M8 5h-2a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h5.697"></path><path d="M18 14v4h4"></path><path d="M18 11v-4a2 2 0 0 0 -2 -2h-2"></path><path d="M8 3m0 2a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v0a2 2 0 0 1 -2 2h-2a2 2 0 0 1 -2 -2z"></path><path d="M18 18m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0"></path><path d="M8 11h4"></path><path d="M8 15h3"></path></svg><span class="hidden sm:inline">Updates</span></button></div><div class="flex items-center gap-2"><label class="inline-flex items-center cursor-pointer gap-2"><input type="checkbox" class="border text-foreground rounded-md border-border bg-background" x-model="onlyPinned"><span class="text-muted-foreground">Pinned only</span></label></div></div></div><!-- Two-column body: results + preview --><div class="border-t grid grid-cols-1 md:grid-cols-2 gap-0 border-border border-border/5"><!-- Results list --><div class="py-2"><div class="px-4 py-1 text-[0.70rem] font-medium text-muted-foreground">Results</div><ul class="divide-y divide-border"><template x-for="(r, idx) in filtered()" :key="r.id"><li :class="isSel(r.id) ? 'bg-background/5' : ''" class="flex items-center justify-between px-4 py-3 cursor-pointer" @mouseenter="selected = idx" @click="selected = idx; choose()"><div class="flex items-center gap-3 text-muted-foreground"><div class="bg-background rounded-lg size-8 grid place-items-center ring-1 ring-border"><template x-if="r.kind==='files'"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler-external-file-dots size-4"><path stroke="none" d="M0 0h24v24H0z" fill="none"></path><path d="M14 3v4a1 1 0 0 0 1 1h4"></path><path d="M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2z"></path><path d="M9 14v.01"></path><path d="M12 14v.01"></path><path d="M15 14v.01"></path></svg></template><template x-if="r.kind==='people'"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler-layout-users-group size-4"><path stroke="none" d="M0 0h24v24H0z" fill="none"></path><path d="M10 13a2 2 0 1 0 4 0a2 2 0 0 0 -4 0"></path><path d="M8 21v-1a2 2 0 0 1 2 -2h4a2 2 0 0 1 2 2v1"></path><path d="M15 5a2 2 0 1 0 4 0a2 2 0 0 0 -4 0"></path><path d="M17 10h2a2 2 0 0 1 2 2v1"></path><path d="M5 5a2 2 0 1 0 4 0a2 2 0 0 0 -4 0"></path><path d="M3 13v-1a2 2 0 0 1 2 -2h2"></path></svg></template><template x-if="r.kind==='updates'"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler-report size-4"><path stroke="none" d="M0 0h24v24H0z" fill="none"></path><path d="M8 5h-2a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h5.697"></path><path d="M18 14v4h4"></path><path d="M18 11v-4a2 2 0 0 0 -2 -2h-2"></path><path d="M8 3m0 2a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v0a2 2 0 0 1 -2 2h-2a2 2 0 0 1 -2 -2z"></path><path d="M18 18m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0"></path><path d="M8 11h4"></path><path d="M8 15h3"></path></svg></template></div><div><div class="text-sm font-medium" x-text="r.title"></div><div class="text-xs text-muted-foreground" x-text="r.subtitle"></div></div></div><div class="flex items-center gap-2"><template x-for="b in r.badges" :key="b"><span class="hidden md:inline text-[0.70rem] px-2 py-0.5 rounded-full bg-background/5 text-muted-foreground" x-text="b"></span></template><button class="flex items-center justify-center text-center shadow-subtle font-medium duration-500 ease-in-out transition-colors focus:outline-2 focus:outline-offset-2 text-muted-foreground bg-muted outline outline-border hover:bg-muted focus:outline-border text-foreground bg-background outline-border hover:bg-muted focus:outline-border size-7 p-0.5 text-xs rounded-md" @click.stop="togglePin(r.id)" :aria-pressed="pinned.has(r.id)" :class="pinned.has(r.id)?'text-foreground':'text-muted-foreground'"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler-arrow-stack-2 size-3" slot="icon"><path stroke="none" d="M0 0h24v24H0z" fill="none"></path><path d="M15 4.5l-4 4l-4 1.5l-1.5 1.5l7 7l1.5 -1.5l1.5 -4l4 -4"></path><path d="M9 15l-4.5 4.5"></path><path d="M14.5 4l5.5 5.5"></path></svg></button></div></li></template><li x-show="filtered().length===0" class="px-4 py-6 text-sm italic text-center text-muted-foreground">No results</li></ul></div><!-- Preview pane --><div class="border-t md:border-t-0 md:border-l border-border p-4 lg:p-8 min-h-[260px] bg-background/2"><template x-if="current()"><div><div class="flex items-start justify-between"><div><div class="text-sm font-semibold text-foreground" x-text="current().title"></div><div class="text-xs text-muted-foreground" x-text="current().subtitle"></div></div><div class="flex items-center gap-2"><button class="relative flex items-center justify-center text-center font-medium transition-colors duration-200 ease-in-out select-none focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:z-10 justify-center rounded-md text-background bg-foreground outline outline-foreground hover:opacity-90 focus-visible:outline-border h-7 px-3 text-xs gap-2" @click="copy()" title="Copy link (⌘/Ctrl+C)"><span x-show="!copied">Copy</span><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler-clipboard size-4" x-show="!copied"><path stroke="none" d="M0 0h24v24H0z" fill="none"></path><path d="M9 5h-2a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-12a2 2 0 0 0 -2 -2h-2"></path><path d="M9 3m0 2a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v0a2 2 0 0 1 -2 2h-2a2 2 0 0 1 -2 -2z"></path></svg><span x-show="copied" class="flex items-center gap-1">Copied</span><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler-circle-check size-4" x-show="copied"><path stroke="none" d="M0 0h24v24H0z" fill="none"></path><path d="M5 12l5 5l10 -10"></path></svg></button><button class="relative flex items-center justify-center text-center font-medium transition-colors duration-200 ease-in-out select-none focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:z-10 justify-center rounded-md text-muted-foreground bg-muted outline outline-border hover:opacity-90 focus-visible:outline-border h-7 px-3 text-xs gap-2" :href="current().href" title="Open">Open<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler-external-link size-3"><path stroke="none" d="M0 0h24v24H0z" fill="none"></path><path d="M12 6h-6a2 2 0 0 0 -2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-6"></path><path d="M11 13l9 -9"></path><path d="M15 4h5v5"></path></svg></button></div></div><div class="mt-8 text-xs leading-relaxed text-muted-foreground"><p>Preview excerpt is shown here to give quick context. Use arrow keys to move, Enter to open, or pin frequently used results.</p><ul class="mt-2 ml-4 list-disc space-y-1"><li>Type to filter — subsequence search.</li><li>Press P to pin/unpin the selection (⌘/Ctrl+P).</li><li>Switch tabs to scope to files, people or updates.</li></ul></div></div></template><div x-show="!current()" class="h-full text-sm grid place-items-center text-muted-foreground">Select a result to preview</div></div></div><!-- Footer --><div class="px-4 py-2 text-[0.70rem] text-muted-foreground flex items-center justify-between bg-background/10"><div>Tips: <kbd class="px-1 border rounded bg-background border-border text-muted-foreground">/</kbd> to search • <kbd class="px-1 border rounded bg-background border-border text-muted-foreground">⌘</kbd>+<kbd class="px-1 border rounded bg-background border-border text-muted-foreground">P</kbd> to pin • <kbd class="px-1 border rounded bg-background border-border text-muted-foreground">⌘</kbd>+<kbd class="px-1 border rounded bg-background border-border text-muted-foreground">C</kbd> to copy</div><div class="items-center hidden sm:flex gap-2"><span class="flex items-center gap-1"><kbd class="px-1 border rounded bg-background border-border text-muted-foreground">↑</kbd><kbd class="px-1 border rounded bg-background border-border text-muted-foreground">↓</kbd> to navigate</span><span class="flex items-center gap-1"><kbd class="px-1 border rounded bg-background border-border text-muted-foreground">↵</kbd> to open</span></div></div></div>
