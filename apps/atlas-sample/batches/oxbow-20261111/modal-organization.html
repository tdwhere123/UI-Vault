<!doctype html>
<html lang="zh-Hans" class="font-sans antialiased">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>创建组织对话框</title>
  <link rel="stylesheet" href="runtime.css">
</head>
<body class="bg-background" data-demo="modal-organization">
<!--
// Make sure to change  "open: false",  to  open: true. On the z-data="{}".
--><div class="w-full max-w-3xl" x-data="{
      open:true,
      drag:false,
      submitting:false,
      form:{
        name:'',
        website:'',
        logo:'',
        slug:'',
        industry:'SaaS',
        size:'1–10',
        hq:'',
        tags:[],
        tagInput:'',
        description:'',
      },
      show(){ this.reset(); this.open = true; this.$nextTick(()=&gt; this.$refs.name?.focus()); },
      reset(){ this.form={ name:'', website:'', logo:'', slug:'', industry:'SaaS', size:'1–10', hq:'', tags:[], tagInput:'', description:'' }; this.drag=false; this.submitting=false; },
      close(){ if(this.submitting) return; this.open=false; },
      urlOk(v){ try { const u=new URL(v.startsWith('http')?v:`https://${v}`); return !!u.host; } catch { return false; } },
      slugOk(v){ return /^[a-z0-9]([a-z0-9-]{1,28})[a-z0-9]$/.test(v||''); },
      valid(){ return this.form.name &amp;&amp; this.urlOk(this.form.website) &amp;&amp; this.slugOk(this.form.slug) &amp;&amp; this.form.description.trim().length&gt;0; },
      addTag(){ const v=(this.form.tagInput||'').trim().toLowerCase(); if(!v) return; if(this.form.tags.length&gt;=10) return; if(!this.form.tags.includes(v)) this.form.tags.push(v); this.form.tagInput=''; },
      rmTag(i){ this.form.tags.splice(i,1); },
      pick(e){ const f=e.target?.files?.[0]; if(f) this.readLogo(f); },
      drop(e){ e.preventDefault(); const f=e.dataTransfer?.files?.[0]; if(f) this.readLogo(f); this.drag=false; },
      readLogo(file){ try{ this.form.logo=URL.createObjectURL(file);}catch{} },
      submit(){ if(!this.valid()) return; this.submitting=true; setTimeout(()=&gt;{ window.dispatchEvent(new CustomEvent('org:create',{ detail:{ ...this.form } })); this.submitting=false; this.open=false; },700); }
    }"><button class="relative flex items-center justify-center text-center font-medium transition-colors duration-200 ease-in-out select-none focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:z-10 justify-center rounded-md text-background bg-foreground outline outline-foreground hover:opacity-90 focus-visible:outline-border h-9 px-4 text-sm mx-auto" type="button" @click="show()">Add organization</button><!-- Backdrop --><div x-show="open" x-transition.opacity class="fixed inset-0 z-40 bg-background/20" aria-hidden="true" @click="close()"></div><!-- Dialog --><div x-show="open" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" class="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="org-title" @keydown.escape.window.prevent="close()"><div x-show="open" @click.outside="close()" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="translate-y-4 sm:translate-y-0 sm:scale-95" x-transition:enter-end="translate-y-0 sm:scale-100" x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" class="w-full sm:max-w-3xl rounded-2xl bg-background shadow-xl outline outline-1 outline-border/5 -outline-offset-1 outline-border/10"><!-- Header --><div class="flex items-center justify-between px-6 py-4 border-b border-border"><div class="flex items-start gap-2"><div class="size-9 rounded-lg grid place-items-center bg-muted text-foreground"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler-circle-info size-4"><path stroke="none" d="M0 0h24v24H0z" fill="none"></path><path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0"></path><path d="M12 9h.01"></path><path d="M11 12h1v4h1"></path></svg></div><div><h2 class="text-sm  font-semibold text-foreground" id="org-title">Create an organization</h2><p class="text-xs  text-muted-foreground">Set a name, logo, and public profile. Takes under 5 minutes.</p></div></div><button class="flex items-center justify-center text-center shadow-subtle font-medium duration-500 ease-in-out transition-colors focus:outline-2 focus:outline-offset-2 text-muted-foreground bg-background outline outline-border hover:text-foreground hover:bg-muted focus:outline-border text-foreground bg-muted outline-border hover:bg-muted focus:outline-border size-7 p-0.5 text-xs rounded-md" aria-label="Close" @click="close()"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler-wave-x size-4"><path stroke="none" d="M0 0h24v24H0z" fill="none"></path><path d="M18 6l-12 12"></path><path d="M6 6l12 12"></path></svg></button></div><!-- Content --><div class="px-6 py-5 space-y-5"><div class="grid grid-cols-1 md:grid-cols-2 gap-4"><!-- Company name --><div><label class="block text-xs font-medium text-foreground">Organization name*</label><input x-ref="name" x-model="form.name" type="text" placeholder="e.g. Northwind" class="mt-1 block w-full h-10 px-4 py-2 text-xs bg-background border border-transparent rounded-lg appearance-none text-muted-foreground duration-300 ring-1 ring-border placeholder:text-muted-foreground focus:border-border focus:border-border focus:bg-transparent focus:outline-none focus:ring-border focus:ring-offset-2 focus:ring-2 sm:text-sm"></div><!-- Website --><div><label class="block text-xs font-medium text-foreground">Website URL*</label><input x-model="form.website" type="text" placeholder="www.example.com" class="mt-1 block w-full h-10 px-4 py-2 text-xs bg-background border border-transparent rounded-lg appearance-none text-muted-foreground duration-300 ring-1 ring-border placeholder:text-muted-foreground focus:border-border focus:border-border focus:bg-transparent focus:outline-none focus:ring-border focus:ring-offset-2 focus:ring-2 sm:text-sm"></div><!-- Logo dropzone spans two cols --><div class="md:col-span-2"><label class="sr-only">Logo*</label><div class="mt-1 grid grid-cols-[96px_1fr] gap-3 items-start"><div class="size-24 rounded-xl overflow-hidden ring-1 ring-border bg-muted grid place-items-center"><img x-show="form.logo" :src="form.logo" alt="Logo" class="size-full object-cover"><div x-show="!form.logo" class="text-muted-foreground"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler-accessibility size-5"><path stroke="none" d="M0 0h24v24H0z" fill="none"></path><path d="M7 3m0 2.667a2.667 2.667 0 0 1 2.667 -2.667h8.666a2.667 2.667 0 0 1 2.667 2.667v8.666a2.667 2.667 0 0 1 -2.667 2.667h-8.666a2.667 2.667 0 0 1 -2.667 -2.667z"></path><path d="M4.012 7.26a2.005 2.005 0 0 0 -1.012 1.737v10c0 1.1 .9 2 2 2h10c.75 0 1.158 -.385 1.5 -1"></path><path d="M17 7h.01"></path><path d="M7 13l3.644 -3.644a1.21 1.21 0 0 1 1.712 0l3.644 3.644"></path><path d="M15 12l1.644 -1.644a1.21 1.21 0 0 1 1.712 0l2.644 2.644"></path></svg></div></div><div><label class="sr-only">Profile image</label><div @dragover.prevent @dragenter.prevent="drag=true" @dragleave.prevent="drag=false" @drop="drop($event)" :class="drag ? 'ring-2 ring-info bg-info/10' : 'ring-1 ring-border'" class="rounded-xl p-4 bg-background text-center"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler-accessibility size-4 text-muted-foreground mx-auto mb-1"><path stroke="none" d="M0 0h24v24H0z" fill="none"></path><path d="M7 3m0 2.667a2.667 2.667 0 0 1 2.667 -2.667h8.666a2.667 2.667 0 0 1 2.667 2.667v8.666a2.667 2.667 0 0 1 -2.667 2.667h-8.666a2.667 2.667 0 0 1 -2.667 -2.667z"></path><path d="M4.012 7.26a2.005 2.005 0 0 0 -1.012 1.737v10c0 1.1 .9 2 2 2h10c.75 0 1.158 -.385 1.5 -1"></path><path d="M17 7h.01"></path><path d="M7 13l3.644 -3.644a1.21 1.21 0 0 1 1.712 0l3.644 3.644"></path><path d="M15 12l1.644 -1.644a1.21 1.21 0 0 1 1.712 0l2.644 2.644"></path></svg><label class="text-xs text-foreground cursor-pointer font-medium"><input type="file" class="sr-only" accept="image/*" @change="pick($event)">Click to upload</label><span class="text-xs text-muted-foreground font-medium">or drag & drop</span><div class="mt-1 text-[0.70rem] text-muted-foreground font-medium">SVG, PNG, JPG, GIF (max 800×400px)</div></div></div></div></div><!-- Slug --><div><label class="block text-xs font-medium text-foreground">Public URL*</label><div class="mt-1 grid grid-cols-[minmax(120px,180px)_1fr] items-center"><div class="block w-full h-10 px-4 py-2 text-xs border border-transparent rounded-lg rounded-r-none appearance-none bg-background/5 text-muted-foreground duration-300 ring-1 ring-border placeholder:text-muted-foreground focus:border-border focus:border-border focus:bg-transparent focus:outline-none focus:ring-border focus:ring-offset-2 focus:ring-2 sm:text-sm">example.com/org/</div><input x-model="form.slug" type="text" placeholder="acme" class="block w-full h-10 px-4 py-2 text-xs bg-background border border-transparent rounded-lg rounded-l-none appearance-none text-muted-foreground duration-300 ring-1 ring-border placeholder:text-muted-foreground focus:border-border focus:border-border focus:bg-transparent focus:outline-none focus:ring-border focus:ring-offset-2 focus:ring-2 sm:text-sm"></div><p class="mt-1 text-[0.70rem]" :class="slugOk(form.slug)?'text-success':'text-destructive'" x-text="slugOk(form.slug) ? 'Looks good' : 'Use 3–30 lowercase letters or dashes' "></p></div><!-- Industry --><div><label class="block text-xs font-medium text-foreground">Industry</label><select x-model="form.industry" class="mt-1 block w-full h-10 px-4 py-2 text-xs bg-background border border-transparent rounded-lg appearance-none text-muted-foreground duration-300 ring-1 ring-border placeholder:text-muted-foreground focus:border-border focus:border-border focus:bg-transparent focus:outline-none focus:ring-border focus:ring-offset-2 focus:ring-2 sm:text-sm"><option>SaaS</option><option>E‑commerce</option><option>Marketplace</option><option>Agency/Services</option><option>Open Source</option></select></div><!-- Size --><div><label class="block text-xs font-medium text-foreground">Team size</label><select x-model="form.size" class="mt-1 block w-full h-10 px-4 py-2 text-xs bg-background border border-transparent rounded-lg appearance-none text-muted-foreground duration-300 ring-1 ring-border placeholder:text-muted-foreground focus:border-border focus:border-border focus:bg-transparent focus:outline-none focus:ring-border focus:ring-offset-2 focus:ring-2 sm:text-sm"><option>1–10</option><option>11–50</option><option>51–200</option><option>200+</option></select></div><!-- HQ --><div class="md:col-span-2"><label class="block text-xs font-medium text-foreground">Headquarters</label><div class="mt-1 flex items-center gap-2"><div class="text-muted-foreground"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler-arrow-map-pin size-4"><path stroke="none" d="M0 0h24v24H0z" fill="none"></path><path d="M9 11a3 3 0 1 0 6 0a3 3 0 0 0 -6 0"></path><path d="M17.657 16.657l-4.243 4.243a2 2 0 0 1 -2.827 0l-4.244 -4.243a8 8 0 1 1 11.314 0z"></path></svg></div><input x-model="form.hq" type="text" placeholder="City, Country" class="flex-1 mt-1 block w-full h-10 px-4 py-2 text-xs bg-background border border-transparent rounded-lg appearance-none text-muted-foreground duration-300 ring-1 ring-border placeholder:text-muted-foreground focus:border-border focus:border-border focus:bg-transparent focus:outline-none focus:ring-border focus:ring-offset-2 focus:ring-2 sm:text-sm"></div></div><!-- Tags --><div class="md:col-span-2"><label class="block text-xs font-medium text-foreground">Keywords (1–10)</label><div class="mt-1 flex items-end gap-2"><input x-model="form.tagInput" @keydown.enter.prevent="addTag()" type="text" placeholder="e.g. b2b, saas, marketplace" class="flex-1 mt-1 block w-full h-10 px-4 py-2 text-xs bg-background border border-transparent rounded-lg appearance-none text-muted-foreground duration-300 ring-1 ring-border placeholder:text-muted-foreground focus:border-border focus:border-border focus:bg-transparent focus:outline-none focus:ring-border focus:ring-offset-2 focus:ring-2 sm:text-sm"><button class="relative flex items-center justify-center text-center font-medium transition-colors duration-200 ease-in-out select-none focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:z-10 justify-center rounded-md text-foreground bg-background outline outline-border hover:bg-muted hover:shadow-sm focus-visible:outline-border h-10 px-5 text-sm" type="button" :disabled="!form.tagInput" @click="addTag()">Add</button></div><div class="mt-2 flex flex-wrap gap-2"><template x-for="(t,i) in form.tags" :key="t"><span class="inline-flex items-center gap-1 text-xs px-2 py-1 rounded-full bg-muted text-foreground"><span x-text="t"></span><button type="button" class="text-muted-foreground hover:text-muted-foreground" @click="rmTag(i)">×</button></span></template></div></div><!-- Description --><div class="md:col-span-2"><label class="block text-xs font-medium text-foreground">About the organization*</label><textarea x-model="form.description" rows="4" placeholder="What do you build? Who do you help?" class="mt-1 block w-full px-4 py-2 text-xs bg-background border border-transparent rounded-lg appearance-none text-muted-foreground duration-300 ring-1 ring-border placeholder:text-muted-foreground focus:border-border focus:border-border focus:bg-transparent focus:outline-none focus:ring-border focus:ring-offset-2 focus:ring-2 sm:text-sm"></textarea></div></div></div><!-- Footer --><div class="px-6 py-4 border-t border-border flex items-center gap-3"><label class="inline-flex items-center gap-2 text-sm text-muted-foreground text-xs"><input type="checkbox" class="rounded border-border bg-background text-foreground focus:ring-border focus:ring-offset-2 focus:ring-2 shadow size-4" x-model="form.dontShow">Don’t show again</label><div class="ml-auto flex items-center gap-2"><button class="relative flex items-center justify-center text-center font-medium transition-colors duration-200 ease-in-out select-none focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:z-10 justify-center rounded-md text-foreground bg-background outline outline-border hover:bg-muted hover:shadow-sm focus-visible:outline-border h-7 px-3 text-xs" type="button" @click="close()" :disabled="submitting">Cancel</button><button class="relative flex items-center justify-center text-center font-medium transition-colors duration-200 ease-in-out select-none focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:z-10 justify-center rounded-md text-accent-foreground bg-brand outline outline-brand hover:opacity-90 focus-visible:outline-border h-7 px-3 text-xs" type="button" @click="submit()" :disabled="!valid() || submitting">Create organization</button></div></div></div></div></div>
  <script src="runtime.js"></script>
</body>
</html>
