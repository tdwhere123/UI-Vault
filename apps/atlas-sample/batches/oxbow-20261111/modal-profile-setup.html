<!doctype html>
<html lang="zh-Hans" class="font-sans antialiased">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>完善资料对话框</title>
  <link rel="stylesheet" href="runtime.css">
</head>
<body class="bg-background" data-demo="modal-profile-setup">
<!--
// Make sure to change  "open: false",  to  open: true. On the z-data="{}".
--><div class="w-full max-w-xl mx-auto" x-data="{
      open:true,
      submitting:false,
      form:{
        avatar:'',
        handle:'',
        intro:'',
        agree:false,
        dontShow:false,
      },
      show(){ this.reset(); this.open=true; this.$nextTick(()=&gt; this.$refs.handle?.focus()); },
      reset(){ this.form={ avatar:'', handle:'@', intro:'', agree:false, dontShow:false }; this.submitting=false; this.drag=false; },
      close(){ if(this.submitting) return; this.open=false; },
      drop(e){ e.preventDefault(); const f=e.dataTransfer?.files?.[0]; if(!f) return; this.readAvatar(f); this.drag=false; },
      pick(e){ const f=e.target?.files?.[0]; if(!f) return; this.readAvatar(f); },
      readAvatar(file){ try { const url = URL.createObjectURL(file); this.form.avatar=url; } catch {} },
      submit(){
        if(!this.form.agree) return;
        this.submitting=true;
        setTimeout(()=&gt;{
          window.dispatchEvent(new CustomEvent('profile:completed', { detail:{ ...this.form } }));
          this.submitting=false; this.open=false;
        }, 900);
      }
    }"><button class="relative flex items-center justify-center text-center font-medium transition-colors duration-200 ease-in-out select-none focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:z-10 justify-center rounded-md text-background bg-foreground outline outline-foreground hover:opacity-90 focus-visible:outline-border h-9 px-4 text-sm mx-auto" type="button" @click="show()">Finish profile</button><!-- Backdrop --><div x-show="open" x-transition.opacity class="fixed inset-0 z-40 bg-background/20" aria-hidden="true" @click="close()"></div><!-- Dialog --><div x-show="open" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" class="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="profile-title" @keydown.escape.window.prevent="close()"><div x-show="open" @click.outside="close()" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="translate-y-4 sm:translate-y-0 sm:scale-95" x-transition:enter-end="translate-y-0 sm:scale-100" x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" class="w-full sm:max-w-xl rounded-2xl bg-background shadow-xl outline outline-1 outline-border/5 -outline-offset-1 outline-border/10"><!-- Header --><div class="flex items-center justify-between px-5 py-4 border-b border-border"><div><h2 class="undefined text-sm font-semibold text-foreground" id="profile-title">Finish setting up your profile</h2><p class="text-xs  text-muted-foreground">Add an avatar, choose a handle, and a short bio.</p></div><button class="flex items-center justify-center text-center shadow-subtle font-medium duration-500 ease-in-out transition-colors focus:outline-2 focus:outline-offset-2 text-muted-foreground bg-background outline outline-border hover:text-foreground hover:bg-muted focus:outline-border text-foreground bg-muted outline-border hover:bg-muted focus:outline-border size-7 p-0.5 text-xs rounded-md" aria-label="Close" @click="close()"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler-wave-x size-4"><path stroke="none" d="M0 0h24v24H0z" fill="none"></path><path d="M18 6l-12 12"></path><path d="M6 6l12 12"></path></svg></button></div><!-- Content --><div class="p-5 space-y-4"><div class="grid grid-cols-1 sm:grid-cols-[96px_1fr] gap-4 items-center"><!-- Avatar --><div class="flex flex-col items-center gap-2"><div class="size-24 rounded-xl overflow-hidden ring-1 ring-border bg-muted grid place-items-center"><template x-if="!form.avatar"><div class="text-muted-foreground"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler-accessibility size-5"><path stroke="none" d="M0 0h24v24H0z" fill="none"></path><path d="M7 3m0 2.667a2.667 2.667 0 0 1 2.667 -2.667h8.666a2.667 2.667 0 0 1 2.667 2.667v8.666a2.667 2.667 0 0 1 -2.667 2.667h-8.666a2.667 2.667 0 0 1 -2.667 -2.667z"></path><path d="M4.012 7.26a2.005 2.005 0 0 0 -1.012 1.737v10c0 1.1 .9 2 2 2h10c.75 0 1.158 -.385 1.5 -1"></path><path d="M17 7h.01"></path><path d="M7 13l3.644 -3.644a1.21 1.21 0 0 1 1.712 0l3.644 3.644"></path><path d="M15 12l1.644 -1.644a1.21 1.21 0 0 1 1.712 0l2.644 2.644"></path></svg></div></template><img x-show="form.avatar" :src="form.avatar" alt="Avatar" class="size-full object-cover"></div><label class="text-[0.70rem] text-muted-foreground text-center">Square images look best</label></div><!-- Dropzone --><div><label class="block text-[0.70rem] font-medium text-foreground">Profile image</label><div @dragover.prevent @dragenter.prevent="drag=true" @dragleave.prevent="drag=false" @drop="drop($event)" :class="drag ? 'outline-2 outline-border bg-muted/10' : 'outline-1 outline-border'" class="mt-1 rounded-xl p-4 bg-background flex items-center justify-center text-center h-[120px] outline outline-1 outline-border"><div><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler-accessibility size-4 text-muted-foreground mx-auto mb-1"><path stroke="none" d="M0 0h24v24H0z" fill="none"></path><path d="M7 3m0 2.667a2.667 2.667 0 0 1 2.667 -2.667h8.666a2.667 2.667 0 0 1 2.667 2.667v8.666a2.667 2.667 0 0 1 -2.667 2.667h-8.666a2.667 2.667 0 0 1 -2.667 -2.667z"></path><path d="M4.012 7.26a2.005 2.005 0 0 0 -1.012 1.737v10c0 1.1 .9 2 2 2h10c.75 0 1.158 -.385 1.5 -1"></path><path d="M17 7h.01"></path><path d="M7 13l3.644 -3.644a1.21 1.21 0 0 1 1.712 0l3.644 3.644"></path><path d="M15 12l1.644 -1.644a1.21 1.21 0 0 1 1.712 0l2.644 2.644"></path></svg><label class="text-xs text-foreground cursor-pointer font-medium"><input type="file" class="sr-only" accept="image/*" @change="pick($event)">Click to upload</label><span class="text-xs text-muted-foreground font-medium">or drag & drop</span><div class="mt-1 text-[0.70rem] text-muted-foreground font-medium">PNG, JPG, GIF (max 800×400px)</div></div></div></div></div><!-- Handle --><div><label class="block text-xs font-medium text-foreground">Handle</label><div class="mt-1 grid grid-cols-[minmax(120px,180px)_1fr]"><div class="block w-full h-10 px-4 py-2 text-xs border border-transparent rounded-lg rounded-r-none appearance-none bg-background/5 text-muted-foreground duration-300 ring-1 ring-border placeholder:text-muted-foreground focus:border-border focus:border-border focus:bg-transparent focus:outline-none focus:ring-border focus:ring-offset-2 focus:ring-2 sm:text-sm">example.com/</div><input x-ref="handle" x-model="form.handle" type="text" placeholder="@username" class="block w-full h-10 px-4 py-2 text-xs bg-background border border-transparent rounded-lg rounded-l-none appearance-none text-muted-foreground duration-300 ring-1 ring-border placeholder:text-muted-foreground focus:border-border focus:border-border focus:bg-transparent focus:outline-none focus:ring-border focus:ring-offset-2 focus:ring-2 sm:text-sm"></div></div><!-- Intro --><div><label class="block text-xs font-medium text-foreground">Short bio</label><textarea x-model="form.intro" rows="4" placeholder="Tell people what you work on…" class="mt-1 block w-full px-4 py-2 text-xs bg-background border border-transparent rounded-lg appearance-none text-muted-foreground duration-300 ring-1 ring-border placeholder:text-muted-foreground focus:border-border focus:border-border focus:bg-transparent focus:outline-none focus:ring-border focus:ring-offset-2 focus:ring-2 sm:text-sm"></textarea></div><!-- Agreement --><label class="inline-flex items-center gap-2 text-xs text-muted-foreground"><input type="checkbox" class="rounded border-border bg-background text-foreground focus:ring-border focus:ring-offset-2 focus:ring-2 shadow size-4" x-model="form.agree">I agree to the <a href="#" class="underline">terms</a> and <a href="#" class="underline">privacy policy</a>.</label></div><!-- Footer --><div class="px-5 py-4 border-t border-border flex items-center gap-3"><label class="inline-flex items-center gap-2 text-sm text-muted-foreground text-xs"><input type="checkbox" class="rounded border-border bg-background text-foreground focus:ring-border focus:ring-offset-2 focus:ring-2 shadow size-4" x-model="form.dontShow">Don’t show again</label><div class="ml-auto flex items-center gap-2"><button class="relative flex items-center justify-center text-center font-medium transition-colors duration-200 ease-in-out select-none focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:z-10 justify-center rounded-md text-foreground bg-background outline outline-border hover:bg-muted hover:shadow-sm focus-visible:outline-border h-7 px-3 text-xs" type="button" @click="close()" :disabled="submitting">Cancel</button><button class="relative flex items-center justify-center text-center font-medium transition-colors duration-200 ease-in-out select-none focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:z-10 justify-center rounded-md text-accent-foreground bg-brand outline outline-brand hover:opacity-90 focus-visible:outline-border h-7 px-3 text-xs" type="button" @click="submit()" :disabled="!form.agree || submitting">Save profile</button></div></div></div></div></div>
  <script src="runtime.js"></script>
</body>
</html>
