<!doctype html>
<html lang="zh-Hans" class="font-sans antialiased">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>价格区间输入</title>
  <link rel="stylesheet" href="runtime.css">
</head>
<body class="bg-background" data-demo="input-price-range">
<section class="justify-center h-full bg-background gap-2 p-15"><div class="w-full max-w-sm mx-auto"><!-- copy:start --><div class="w-full"><div class="flex justify-between items-baseline mb-1"><label for="price-range-from" class="font-medium text-muted-foreground text-sm">Price Range</label></div><div class="flex w-full gap-2" x-data="{ fromValue: '', toValue: '' }"><div class="relative z-0 flex-1 focus-within:z-10"><input id="price-range-from" name="price-from" type="text" placeholder="From" x-model="fromValue" class="w-full block transition duration-300 ease-in-out leading-tight align-middle focus:z-10 h-10 px-4 py-2 text-sm rounded-md bg-background border border-transparent text-muted-foreground ring-1 ring-border placeholder:text-muted-foreground focus:border-border focus:ring-border focus:ring-2 focus:outline-none shadow-sm bg-background text-foreground ring-border placeholder:text-muted-foreground focus:border-border focus:ring-border  rounded-r-none"><div class="absolute inset-y-0 right-0 flex items-center pr-3"><button x-show="fromValue" type="button" @click="fromValue = ''" class="text-muted-foreground hover:text-muted-foreground focus:outline-none" aria-label="Clear input"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler-wave-x size-4 text-muted-foreground"><path stroke="none" d="M0 0h24v24H0z" fill="none"></path><path d="M18 6l-12 12"></path><path d="M6 6l12 12"></path></svg></button></div></div><div class="relative z-0 flex-1 focus-within:z-10"><input id="price-range-to" name="price-to" type="text" placeholder="To" x-model="toValue" class="w-full block transition duration-300 ease-in-out leading-tight align-middle focus:z-10 h-10 px-4 py-2 text-sm rounded-md bg-background border border-transparent text-muted-foreground ring-1 ring-border placeholder:text-muted-foreground focus:border-border focus:ring-border focus:ring-2 focus:outline-none shadow-sm bg-background text-foreground ring-border placeholder:text-muted-foreground focus:border-border focus:ring-border  rounded-l-none border-l-0"><div class="absolute inset-y-0 right-0 flex items-center pr-3"><button x-show="toValue" type="button" @click="toValue = ''" class="text-muted-foreground hover:text-muted-foreground focus:outline-none" aria-label="Clear input"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler-wave-x size-4 text-muted-foreground"><path stroke="none" d="M0 0h24v24H0z" fill="none"></path><path d="M18 6l-12 12"></path><path d="M6 6l12 12"></path></svg></button></div></div></div></div><!-- copy:end --></div></section>
  <script src="runtime.js"></script>
</body>
</html>
