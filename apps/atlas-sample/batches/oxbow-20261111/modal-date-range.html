<!doctype html>
<html lang="zh-Hans" class="font-sans antialiased">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>日期范围对话框</title>

<body class="bg-background" data-demo="modal-date-range">
<!--
// Make sure to change  "open: false",  to  open: true. On the z-data="{}".
--><div class="w-full max-w-4xl" x-data="{
    open:true,
    // Selection
    start:null, end:null,
    hover:null,
    range:true,
    // Constraints / options
    disableWeekends:false,
    minDate:null,
    maxDate:null,
    // Calendar view (left month)
    view: new Date(new Date().getFullYear(), new Date().getMonth(), 1),
    presetsOpen:false,
    // Helpers
    fmt(d){ return d ? d.toLocaleDateString(undefined,{ month:'short', day:'numeric', year:'numeric'}) : '' },
    ymd(d){ return [d.getFullYear(), d.getMonth(), d.getDate()].join('-') },
    addMonths(d,n){ return new Date(d.getFullYear(), d.getMonth()+n, 1) },
    daysInMonth(d){ return new Date(d.getFullYear(), d.getMonth()+1, 0).getDate() },
    weekStart(d){ // monday-based index
      const day=(new Date(d.getFullYear(), d.getMonth(), 1).getDay()+6)%7; return day;
    },
    isoWeek(d){
      const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
      const dayNum = (date.getUTCDay()+6)%7; // Mon=0
      date.setUTCDate(date.getUTCDate() - dayNum + 3); // Thu of this week
      const firstThursday = new Date(Date.UTC(date.getUTCFullYear(),0,4));
      const firstDayNum = (firstThursday.getUTCDay()+6)%7;
      firstThursday.setUTCDate(firstThursday.getUTCDate() - firstDayNum + 3);
      const week = 1 + Math.round((date - firstThursday) / (7*24*3600*1000));
      return week;
    },
    buildMonthCells(d){
      const year=d.getFullYear(); const month=d.getMonth();
      const firstPad=this.weekStart(d);
      const days=this.daysInMonth(d);
      const prevMonth=new Date(year,month-1,1);
      const prevDays=this.daysInMonth(prevMonth);
      const cells=[];
      // leading from prev month
      for(let i=firstPad-1;i&gt;=0;i--){ cells.push({ date:new Date(year,month-1,prevDays-i), inMonth:false }); }
      // current month
      for(let i=1;i&lt;=days;i++){ cells.push({ date:new Date(year,month,i), inMonth:true }); }
      // trailing to complete 42
      while(cells.length%7!==0){ const last=cells[cells.length-1].date; cells.push({ date:new Date(last.getFullYear(), last.getMonth(), last.getDate()+1), inMonth:false }); }
      return cells;
    },
    buildWeeks(d){ const cells=this.buildMonthCells(d); const rows=[]; for(let i=0;i&lt;cells.length;i+=7){ const row=cells.slice(i,i+7); rows.push({ key:this.ymd(row[0].date)+'-w', week:this.isoWeek(row[0].date), cells:row }); } return rows; },
    isSame(a,b){ return a &amp;&amp; b &amp;&amp; a.getFullYear()===b.getFullYear() &amp;&amp; a.getMonth()===b.getMonth() &amp;&amp; a.getDate()===b.getDate() },
    isDisabled(d){ if(!d) return true; if(this.minDate &amp;&amp; d &lt; this.minDate) return true; if(this.maxDate &amp;&amp; d &gt; this.maxDate) return true; if(this.disableWeekends){ const wd=d.getDay(); if(wd===0||wd===6) return true; } return false; },
    inRange(d){ if(!this.start||!this.end||!d) return false; const t=d.getTime(); return t&gt;=this.start.getTime() &amp;&amp; t&lt;=this.end.getTime() },
    previewInRange(d){ if(!d||!this.start||this.end) return false; if(!this.hover) return false; const a=this.start.getTime(); const b=this.hover.getTime(); const min=Math.min(a,b), max=Math.max(a,b); const t=d.getTime(); return t&gt;=min &amp;&amp; t&lt;=max; },
    pick(d){ if(!d || this.isDisabled(d)) return; if(!this.range){ this.start=d; this.end=d; return; }
      if(!this.start || (this.start &amp;&amp; this.end)) { this.start=d; this.end=null; }
      else if(d.getTime()&lt;this.start.getTime()) { this.end=this.start; this.start=d; }
      else { this.end=d; }
    },
    setPreset(name){ const today=new Date(); const s=(n)=&gt;{const x=new Date(today); x.setDate(x.getDate()+n); return new Date(x.getFullYear(),x.getMonth(),x.getDate());};
      if(name==='today'){ this.start=s(0); this.end=s(0); }
      else if(name==='yesterday'){ this.start=s(-1); this.end=s(-1); }
      else if(name==='last7'){ this.start=s(-6); this.end=s(0); }
      else if(name==='last30'){ this.start=s(-29); this.end=s(0); }
      else if(name==='thisWeek'){ const wd=(today.getDay()+6)%7; this.start=s(-wd); this.end=s(6-wd); }
      else if(name==='lastWeek'){ const wd=(today.getDay()+6)%7; this.start=s(-wd-7); this.end=s(6-wd-7); }
      else if(name==='thisMonth'){ const d=new Date(today.getFullYear(), today.getMonth(), 1); this.start=d; this.end=new Date(today.getFullYear(), today.getMonth()+1, 0); }
      else if(name==='lastMonth'){ const d=new Date(today.getFullYear(), today.getMonth()-1, 1); this.start=d; this.end=new Date(d.getFullYear(), d.getMonth()+1, 0); }
      else if(name==='thisYear'){ this.start=new Date(today.getFullYear(),0,1); this.end=new Date(today.getFullYear(),11,31); }
      else if(name==='lastYear'){ const y=today.getFullYear()-1; this.start=new Date(y,0,1); this.end=new Date(y,11,31); }
      else if(name==='allTime'){ this.start=new Date(2000,0,1); this.end=new Date(today.getFullYear()+5,11,31); }
    },
    // Time selection
    startTime:'00:00', endTime:'00:00',
    clear(){ this.start=null; this.end=null; this.hover=null; this.startTime='00:00'; this.endTime='00:00'; },
    apply(){
      const parseHM=(s)=&gt;{ if(!s) return [0,0]; const [h,m]=s.split(':').map(n=&gt;parseInt(n,10)||0); return [h,m]; };
      let s=this.start? new Date(this.start) : null; let e=this.end? new Date(this.end) : null;
      if(s){ const [sh,sm]=parseHM(this.startTime); s.setHours(sh,sm,0,0); }
      if(e){ const [eh,em]=parseHM(this.endTime); e.setHours(eh,em,0,0); }
      window.dispatchEvent(new CustomEvent('daterange:apply', { detail:{ start:s, end:e } }));
      this.open=false;
    }
  }"><button class="relative flex items-center justify-center text-center font-medium transition-colors duration-200 ease-in-out select-none focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:z-10 justify-center rounded-md text-background bg-foreground outline outline-foreground hover:opacity-90 focus-visible:outline-border h-9 px-4 text-sm mx-auto" type="button" @click="open=true">Choose dates</button><div x-show="open" x-transition.opacity class="fixed inset-0 z-40 bg-background/20" aria-hidden="true" @click="open=false"></div><div x-show="open" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" class="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="drp-title" @keydown.escape.window.prevent="open=false"><div x-show="open" @click.outside="open=false" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="translate-y-4 sm:translate-y-0 sm:scale-95" x-transition:enter-end="translate-y-0 sm:scale-100" x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" class="w-full sm:max-w-4xl rounded-2xl bg-background shadow-xl outline outline-1 outline-border/5 -outline-offset-1 outline-border/10"><div class="lg:grid lg:grid-cols-[220px_1fr]"><!-- Presets --><aside class="p-4 lg:border-r border-border text-sm relative"><div><button class="relative flex items-center justify-center text-center font-medium transition-colors duration-200 ease-in-out select-none focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:z-10 justify-between rounded-md text-foreground bg-background outline outline-border hover:bg-muted hover:shadow-sm focus-visible:outline-border h-8 px-3.5 text-xs gap-2 w-full flex items-center justify-between" type="button" @click="presetsOpen=!presetsOpen"><span>Presets</span><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler-chevron-down size-4" slot="right-icon"><path stroke="none" d="M0 0h24v24H0z" fill="none"></path><path d="M6 9l6 6l6 -6"></path></svg></button><div x-show="presetsOpen" @click.outside="presetsOpen=false" class="absolute z-10 mt-2 w-48 rounded-md bg-background shadow ring-1 ring-border overflow-hidden"><button class="w-full text-left px-3 py-2 hover:bg-background/10 text-foreground" @click="setPreset('today'); presetsOpen=false">Today</button><button class="w-full text-left px-3 py-2 hover:bg-background/10 text-foreground" @click="setPreset('yesterday'); presetsOpen=false">Yesterday</button><button class="w-full text-left px-3 py-2 hover:bg-background/10 text-foreground" @click="setPreset('last7'); presetsOpen=false">Last 7 days</button><button class="w-full text-left px-3 py-2 hover:bg-background/10 text-foreground" @click="setPreset('last30'); presetsOpen=false">Last 30 days</button><button class="w-full text-left px-3 py-2 hover:bg-background/10 text-foreground" @click="setPreset('thisWeek'); presetsOpen=false">This week</button><button class="w-full text-left px-3 py-2 hover:bg-background/10 text-foreground" @click="setPreset('lastWeek'); presetsOpen=false">Last week</button><button class="w-full text-left px-3 py-2 hover:bg-background/10 text-foreground" @click="setPreset('thisMonth'); presetsOpen=false">This month</button><button class="w-full text-left px-3 py-2 hover:bg-background/10 text-foreground" @click="setPreset('lastMonth'); presetsOpen=false">Last month</button><button class="w-full text-left px-3 py-2 hover:bg-background/10 text-foreground" @click="setPreset('thisYear'); presetsOpen=false">This year</button><button class="w-full text-left px-3 py-2 hover:bg-background/10 text-foreground" @click="setPreset('lastYear'); presetsOpen=false">Last year</button><button class="w-full text-left px-3 py-2 hover:bg-background/10 text-foreground" @click="setPreset('allTime'); presetsOpen=false">All time</button></div></div><div class="mt-4 space-y-2 border-t pt-4 border-border"><label class="flex items-center gap-2 text-muted-foreground"><input type="checkbox" class="rounded border-border bg-background text-foreground focus:ring-border focus:ring-offset-2 focus:ring-2 shadow size-4" x-model="range"><span>Range selection</span></label><label class="flex items-center gap-2 text-muted-foreground"><input type="checkbox" class="rounded border-border bg-background text-foreground focus:ring-border focus:ring-offset-2 focus:ring-2 shadow size-4" x-model="disableWeekends"><span>Disable weekends</span></label><div class="flex flex-col gap-2 text-xs text-muted-foreground mt-4"><button class="relative flex items-center justify-center text-center font-medium transition-colors duration-200 ease-in-out select-none focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:z-10 justify-center rounded-md text-foreground bg-background outline outline-border hover:bg-muted hover:shadow-sm focus-visible:outline-border h-7 px-3 text-xs" type="button" @click="const t=new Date(); minDate=new Date(t.getFullYear(),t.getMonth(),1); maxDate=new Date(t.getFullYear(),t.getMonth()+1,0)">Limit to this month</button><button class="relative flex items-center justify-center text-center font-medium transition-colors duration-200 ease-in-out select-none focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:z-10 justify-center rounded-md text-foreground bg-background outline outline-border hover:bg-muted hover:shadow-sm focus-visible:outline-border h-7 px-3 text-xs" type="button" @click="minDate=null; maxDate=null">Clear limits</button></div></div></aside><!-- Calendars --><section class="p-4"><div class="grid grid-cols-1 md:grid-cols-2 gap-4"><div class="rounded-xl outline outline-border overflow-hidden"><div class="flex items-center justify-between px-3 py-2 border-b border-border"><button class="flex items-center justify-center text-center shadow-subtle font-medium duration-500 ease-in-out transition-colors focus:outline-2 focus:outline-offset-2 text-muted-foreground bg-muted outline outline-border hover:bg-muted focus:outline-border text-foreground bg-background outline-border hover:bg-muted focus:outline-border size-7 p-0.5 text-xs rounded-md" @click="view = addMonths(view,-1)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler-chevron-left size-3" slot="icon"><path stroke="none" d="M0 0h24v24H0z" fill="none"></path><path d="M15 6l-6 6l6 6"></path></svg></button><div class="text-sm font-medium text-muted-foreground" x-text="view.toLocaleDateString(undefined,{ month:'long', year:'numeric' })"></div><div class="w-6"></div></div><div class="p-3 text-xs"><div class="grid grid-cols-8 text-center text-muted-foreground"><span class="text-left pl-1">Wk</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span></div><div class="mt-1 space-y-1"><template x-for="row in buildWeeks(view)" :key="row.key"><div class="grid grid-cols-8"><span class="text-[10px] leading-8 text-muted-foreground pl-1">#<span x-text="row.week"></span></span><template x-for="cell in row.cells" :key="ymd(cell.date)"><button @mouseenter="hover = cell.date" @mouseleave="hover = null" :disabled="isDisabled(cell.date)" @click="pick(cell.date)" class="h-8 w-8 mx-auto rounded-full text-xs flex items-center justify-center" :class="[ isDisabled(cell.date) 'opacity-40 cursor-not-allowed' 'hover:bg-background/10', (isSame(cell.date,start) || isSame(cell.date,end)) 'bg-muted ((inRange(cell.date) previewInRange(cell.date)) 'bg-muted/20 text-foreground' (cell.inMonth ? 'text-foreground' : 'text-muted-foreground') ) ]" x-text="cell.date.getDate()"></button></template></div></template></div></div></div><div class="rounded-xl outline outline-border overflow-hidden"><div class="flex items-center justify-between px-3 py-2 border-b border-border"><div class="w-6"></div><div class="text-sm font-medium text-muted-foreground" x-text="addMonths(view,1).toLocaleDateString(undefined,{ month:'long', year:'numeric' })"></div><button class="flex items-center justify-center text-center shadow-subtle font-medium duration-500 ease-in-out transition-colors focus:outline-2 focus:outline-offset-2 text-muted-foreground bg-muted outline outline-border hover:bg-muted focus:outline-border text-foreground bg-background outline-border hover:bg-muted focus:outline-border size-7 p-0.5 text-xs rounded-md px-2 py-1" @click="view = addMonths(view,1)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler-chevron-right size-3" slot="icon"><path stroke="none" d="M0 0h24v24H0z" fill="none"></path><path d="M9 6l6 6l-6 6"></path></svg></button></div><div class="p-3 text-xs"><div class="grid grid-cols-8 text-center text-muted-foreground"><span class="text-left pl-1">Wk</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span></div><div class="mt-1 space-y-1"><template x-for="row in buildWeeks(addMonths(view,1))" :key="row.key"><div class="grid grid-cols-8"><span class="text-[10px] leading-8 text-muted-foreground pl-1">#<span x-text="row.week"></span></span><template x-for="cell in row.cells" :key="ymd(cell.date)"><button @mouseenter="hover = cell.date" @mouseleave="hover = null" :disabled="isDisabled(cell.date)" @click="pick(cell.date)" class="h-8 w-8 mx-auto rounded-full text-xs flex items-center justify-center" :class="[ isDisabled(cell.date) 'opacity-40 cursor-not-allowed' 'hover:bg-background/10', (isSame(cell.date,start) || isSame(cell.date,end)) 'bg-muted ((inRange(cell.date) previewInRange(cell.date)) 'bg-muted/20 text-foreground' (cell.inMonth ? 'text-foreground' : 'text-muted-foreground') ) ]" x-text="cell.date.getDate()"></button></template></div></template></div></div></div></div><!-- Inputs + actions --><div class="mt-3 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 items-center gap-2 border-t border-border pt-3"><input :value="fmt(start)" readonly class="block w-full h-10 px-4 py-2 text-xs bg-background border border-transparent rounded-lg appearance-none text-muted-foreground duration-300 ring-1 ring-border placeholder:text-muted-foreground focus:border-border focus:border-border focus:bg-transparent focus:outline-none focus:ring-border focus:ring-offset-2 focus:ring-2 sm:text-sm" placeholder="Start date"><input :value="fmt(end)" readonly class="block w-full h-10 px-4 py-2 text-xs bg-background border border-transparent rounded-lg appearance-none text-muted-foreground duration-300 ring-1 ring-border placeholder:text-muted-foreground focus:border-border focus:border-border focus:bg-transparent focus:outline-none focus:ring-border focus:ring-offset-2 focus:ring-2 sm:text-sm" placeholder="End date"><input type="time" x-model="startTime" class="block w-full h-10 px-4 py-2 text-xs bg-background border border-transparent rounded-lg appearance-none text-muted-foreground duration-300 ring-1 ring-border placeholder:text-muted-foreground focus:border-border focus:border-border focus:bg-transparent focus:outline-none focus:ring-border focus:ring-offset-2 focus:ring-2 sm:text-sm [color-scheme:dark]"><input type="time" x-model="endTime" class="block w-full h-10 px-4 py-2 text-xs bg-background border border-transparent rounded-lg appearance-none text-muted-foreground duration-300 ring-1 ring-border placeholder:text-muted-foreground focus:border-border focus:border-border focus:bg-transparent focus:outline-none focus:ring-border focus:ring-offset-2 focus:ring-2 sm:text-sm [color-scheme:dark]"><div class="col-span-2 lg:col-span-4 flex items-center justify-between gap-2 mt-2"><div class="flex flex-wrap items-center gap-2"><button class="relative flex items-center justify-center text-center font-medium transition-colors duration-200 ease-in-out select-none focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:z-10 justify-center rounded-md text-foreground bg-background outline outline-border hover:bg-muted hover:shadow-sm focus-visible:outline-border h-7 px-3 text-xs" type="button" @click="clear()">Clear</button><button class="relative flex items-center justify-center text-center font-medium transition-colors duration-200 ease-in-out select-none focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:z-10 justify-center rounded-md text-foreground bg-background outline outline-border hover:bg-muted hover:shadow-sm focus-visible:outline-border h-7 px-3 text-xs" type="button" @click="setPreset('today')">Today</button></div><div class="flex flex-wrap items-center gap-2"><button class="relative flex items-center justify-center text-center font-medium transition-colors duration-200 ease-in-out select-none focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:z-10 justify-center rounded-md text-foreground bg-background outline outline-border hover:bg-muted hover:shadow-sm focus-visible:outline-border h-7 px-3 text-xs" type="button" @click="open=false">Cancel</button><button class="relative flex items-center justify-center text-center font-medium transition-colors duration-200 ease-in-out select-none focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:z-10 justify-center rounded-md text-accent-foreground bg-brand outline outline-brand hover:opacity-90 focus-visible:outline-border h-7 px-3 text-xs" type="button" :disabled="!start||!end" @click="apply()">Apply</button></div></div></div></section></div></div></div></div>
