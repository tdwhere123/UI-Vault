<!doctype html>

<body class="bg-background" data-demo="modal-plan">
<!--
// Make sure to change  "open: false",  to  open: true. On the z-data="{}".
--><div class="w-full max-w-xl mx-auto" x-data="{
      open:true,
      selected:'basic',
      dontShow:false,
      show(){ this.open=true; },
      close(){ this.open=false; },
      confirm(){
        window.dispatchEvent(new CustomEvent('pricing:selected', { detail:{ plan:this.selected, dontShow:this.dontShow } }));
        this.close();
      }
    }"><button class="relative flex items-center justify-center text-center font-medium transition-colors duration-200 ease-in-out select-none focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:z-10 justify-center rounded-md text-background bg-foreground outline outline-foreground hover:opacity-90 focus-visible:outline-border h-9 px-4 text-sm mx-auto" type="button" @click="show()">Choose AI Plan</button><!-- Backdrop --><div x-show="open" x-transition.opacity class="fixed inset-0 z-40 bg-background/20" aria-hidden="true" @click="close()"></div><!-- Dialog --><div x-show="open" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" class="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="plan-title" @keydown.escape.window.prevent="close()"><div x-show="open" @click.outside="close()" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="translate-y-4 sm:translate-y-0 sm:scale-95" x-transition:enter-end="translate-y-0 sm:scale-100" x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" class="w-full sm:max-w-xl rounded-2xl bg-background shadow-xl outline outline-1 outline-border/5 -outline-offset-1 outline-border/10"><!-- Header --><div class="flex items-center justify-between px-5 py-4 border-b border-border"><div class="flex items-start gap-3"><div class="size-9 rounded-full grid place-items-center bg-muted text-foreground"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler-arrow-stack-2 size-4"><path stroke="none" d="M0 0h24v24H0z" fill="none"></path><path d="M12 4l-8 4l8 4l8 -4l-8 -4"></path><path d="M4 12l8 4l8 -4"></path><path d="M4 16l8 4l8 -4"></path></svg></div><div><h2 class="text-sm  font-semibold text-foreground" id="plan-title">Choose Your AI Chat Plan</h2><p class="text-xs  text-muted-foreground">Unlock the power of AI conversations with flexible plans.</p></div></div><button class="flex items-center justify-center text-center shadow-subtle font-medium duration-500 ease-in-out transition-colors focus:outline-2 focus:outline-offset-2 text-muted-foreground bg-background outline outline-border hover:text-foreground hover:bg-muted focus:outline-border text-foreground bg-muted outline-border hover:bg-muted focus:outline-border size-7 p-0.5 text-xs rounded-md" aria-label="Close" @click="close()"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler-wave-x size-4"><path stroke="none" d="M0 0h24v24H0z" fill="none"></path><path d="M18 6l-12 12"></path><path d="M6 6l12 12"></path></svg></button></div><!-- Content --><div class="p-5"><div class="flex flex-col gap-4"><!-- Basic card --><button type="button" @click="selected='basic'" :class="selected==='basic' ? 'outline-2 outline-border : 'outline-border bg-background'" class="text-left w-full rounded-xl p-4 hover:bg-background/4 grid grid-cols-1 md:grid-cols-2 gap-y-4"><div class="flex items-start justify-between"><div><h3 class="text-xl sm:text-xl md:text-2xl font-semibold text-foreground">$5/mth</h3><p class="text-sm  text-sm font-medium text-foreground">Basic Chat</p><p class="text-xs  text-muted-foreground">Billed monthly</p></div></div><ul class="space-y-1 text-sm text-muted-foreground"><li class="flex items-center gap-2"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler-circle-check size-4 text-foreground"><path stroke="none" d="M0 0h24v24H0z" fill="none"></path><path d="M5 12l5 5l10 -10"></path></svg> 100 AI messages per month</li><li class="flex items-center gap-2"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler-circle-check size-4 text-foreground"><path stroke="none" d="M0 0h24v24H0z" fill="none"></path><path d="M5 12l5 5l10 -10"></path></svg> Standard response quality</li><li class="flex items-center gap-2"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler-circle-check size-4 text-foreground"><path stroke="none" d="M0 0h24v24H0z" fill="none"></path><path d="M5 12l5 5l10 -10"></path></svg> Basic chat history</li><li class="flex items-center gap-2"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler-circle-check size-4 text-foreground"><path stroke="none" d="M0 0h24v24H0z" fill="none"></path><path d="M5 12l5 5l10 -10"></path></svg> Email support</li></ul></button><!-- Business card --><button type="button" @click="selected='business'" :class="selected==='business' ? 'outline-2 outline-border : 'outline-border bg-background'" class="text-left w-full rounded-xl p-4 hover:bg-background/4 grid grid-cols-1 md:grid-cols-2 gap-y-4"><div class="flex items-start justify-between"><div><h3 class="text-xl sm:text-xl md:text-2xl font-semibold text-foreground">$15/mth</h3><p class="text-sm  font-medium text-foreground">Pro Chat</p><p class="text-xs  text-muted-foreground">Billed monthly</p></div></div><ul class="space-y-1 text-sm text-muted-foreground"><li class="flex items-center gap-2"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler-circle-check size-4 text-foreground"><path stroke="none" d="M0 0h24v24H0z" fill="none"></path><path d="M5 12l5 5l10 -10"></path></svg> Unlimited AI messages</li><li class="flex items-center gap-2"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler-circle-check size-4 text-foreground"><path stroke="none" d="M0 0h24v24H0z" fill="none"></path><path d="M5 12l5 5l10 -10"></path></svg> Advanced AI responses</li><li class="flex items-center gap-2"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler-circle-check size-4 text-foreground"><path stroke="none" d="M0 0h24v24H0z" fill="none"></path><path d="M5 12l5 5l10 -10"></path></svg> Full chat history</li><li class="flex items-center gap-2"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler-circle-check size-4 text-foreground"><path stroke="none" d="M0 0h24v24H0z" fill="none"></path><path d="M5 12l5 5l10 -10"></path></svg> Priority support</li></ul></button></div></div><!-- Footer --><div class="px-5 py-4 border-t border-border flex items-center gap-3"><label class="inline-flex items-center gap-2 text-sm text-muted-foreground"><input type="checkbox" class="rounded border-border bg-background text-foreground focus:ring-border focus:ring-offset-2 focus:ring-2 shadow size-4" x-model="dontShow">Don't show again</label><div class="ml-auto flex items-center gap-2"><button class="relative flex items-center justify-center text-center font-medium transition-colors duration-200 ease-in-out select-none focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:z-10 justify-center rounded-md text-foreground bg-background outline outline-border hover:bg-muted hover:shadow-sm focus-visible:outline-border h-7 px-3 text-xs" type="button" @click="close()">Cancel</button><button class="relative flex items-center justify-center text-center font-medium transition-colors duration-200 ease-in-out select-none focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:z-10 justify-center rounded-md text-accent-foreground bg-brand outline outline-brand hover:opacity-90 focus-visible:outline-border h-7 px-3 text-xs" type="button" @click="confirm()">Confirm</button></div></div></div></div></div>
  <script src="runtime.js"></script>
</body>
</html>
