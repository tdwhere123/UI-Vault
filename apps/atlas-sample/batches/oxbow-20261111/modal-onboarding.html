<!doctype html>
<html lang="zh-Hans" class="font-sans antialiased">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>入门引导对话框</title>
  <link rel="stylesheet" href="runtime.css">
</head>
<body class="bg-background" data-demo="modal-onboarding">
<!--
// Make sure to change  "open: false",  to  open: true. On the z-data="{}".
--><div class="w-full max-w-xl" x-data="{
      open:true,
      i:0,
      slides:[
        { id:'welcome', title:'Welcome – quick tour', body:'Here are a few tips to get you productive in under a minute.', media:'welcome' },
        { id:'theme', title:'Pick a theme', body:'Choose the interface that feels right. You can change it anytime.', media:'theme' },
        { id:'shortcuts', title:'Keyboard shortcuts', body:'Open the command bar with ⌘K or /, then use ↑ ↓ and ↵ to navigate.', media:'kbd' },
        { id:'done', title:'You’re all set', body:'We’ve configured the basics. You can revisit this tour from Settings.', media:'done' },
      ],
      theme:'system',
      get total(){ return this.slides.length; },
      get last(){ return this.i === this.total - 1; },
      show(){ this.open=true; this.i=0; },
      close(){ this.open=false; },
      next(){ if(this.i &lt; this.total-1) this.i++; else this.finish(); },
      prev(){ if(this.i&gt;0) this.i--; },
      jump(n){ if(n&gt;=0 &amp;&amp; n&lt;this.total) this.i=n; },
      finish(){ this.open=false; window.dispatchEvent(new CustomEvent('onboarding:complete', { detail:{ theme:this.theme }})); },
      onKey(e){ if(!this.open) return; if(e.key==='ArrowRight') { e.preventDefault(); this.next(); } if(e.key==='ArrowLeft'){ e.preventDefault(); this.prev(); } }
    }" @keydown.window="onKey($event)"><button class="relative flex items-center justify-center text-center font-medium transition-colors duration-200 ease-in-out select-none focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:z-10 justify-center rounded-md text-background bg-foreground outline outline-foreground hover:opacity-90 focus-visible:outline-border h-9 px-4 text-sm mx-auto" type="button" @click="show()">Start onboarding</button><!-- Backdrop --><div x-show="open" x-transition.opacity class="fixed inset-0 z-40 bg-background/20" aria-hidden="true" @click="close()"></div><!-- Dialog --><div x-show="open" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" class="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="ob-title" @keydown.escape.window.prevent="close()"><div x-show="open" @click.outside="close()" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="translate-y-4 sm:translate-y-0 sm:scale-95" x-transition:enter-end="translate-y-0 sm:scale-100" x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" class="w-full sm:max-w-md rounded-2xl bg-background shadow-xl outline outline-1 outline-border/5 -outline-offset-1 outline-border/10"><!-- Media / Header --><div class="p-4 pb-0"><div class="rounded-xl overflow-hidden bg-radial-[at_50%_75%] from-info/20 via-muted/40 to-info to-90%"><!-- Media variants --><div class="aspect-[16/9] grid place-items-center"><template x-if="slides[i].media==='welcome'"><svg class="h-32 text-foreground" size="base" viewBox="0 0 2895 2895" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1936.72 1316.69V1677.28L1700.54 1540.97V1452.99L1537.73 1359.06L1461.65 1315.07V1042.46L1536.29 1085.55L1773.92 1222.76L1936.72 1316.69Z" stroke="currentColor" stroke-width="18.0294" stroke-linecap="round" stroke-linejoin="round"></path><path d="M988.017 1041.56V1315.79L913.191 1359.06L753.454 1451.19V1537.55L516.003 1674.75V1314.16L675.746 1221.85L911.752 1085.55L988.017 1041.56Z" stroke="currentColor" stroke-width="18.0294" stroke-linecap="round" stroke-linejoin="round"></path><path d="M2408.73 1044.08L2096.46 1224.38L1936.72 1316.69L1773.92 1222.75L1536.29 1085.55L1461.65 1042.46L1621.57 950.15L1696.21 907.06L1933.65 769.856L2408.73 1044.08Z" fill="currentColor" stroke="currentColor" stroke-width="18.0294" stroke-linecap="round" stroke-linejoin="round"></path><path d="M1696.23 632.653L1383.96 812.947L1224.03 905.257L1061.23 811.324L748.96 631.03L1221.15 358.425L1696.23 632.653Z" fill="currentColor" stroke="currentColor" stroke-width="18.0294" stroke-linecap="round" stroke-linejoin="round"></path><path d="M988.023 1041.56L911.761 1085.55L675.754 1221.85L516.012 1314.16L353.21 1220.05L40.9387 1039.76L512.947 767.333L748.954 903.635L825.218 947.627L988.023 1041.56Z" fill="currentColor" stroke="currentColor" stroke-width="18.0294" stroke-linecap="round" stroke-linejoin="round"></path><path d="M2408.73 1044.08V1404.67L1936.72 1677.28V1316.69L2096.46 1224.38L2408.73 1044.08Z" stroke="currentColor" stroke-width="18.0294" stroke-linecap="round" stroke-linejoin="round"></path><path d="M1700.55 1452.99V1813.58L1228.54 2086.18V1725.59L1388.28 1633.28L1624.47 1496.98L1700.55 1452.99Z" stroke="currentColor" stroke-width="18.0294" stroke-linecap="round" stroke-linejoin="round"></path><path d="M1700.55 1452.99L1624.47 1496.98L1388.28 1633.28L1228.54 1725.59L1065.74 1631.48L828.288 1494.46L753.468 1451.19L913.207 1359.06L988.031 1315.79L1149.39 1222.75L1224.03 1179.66L1225.48 1178.76L1300.12 1221.85L1461.66 1315.07L1537.75 1359.06L1700.55 1452.99Z" fill="currentColor" stroke="currentColor" stroke-width="18.0294" stroke-linecap="round" stroke-linejoin="round"></path><path d="M1228.54 1725.59V2086.18L753.468 1811.77V1451.19L828.288 1494.46L1065.74 1631.48L1228.54 1725.59Z" stroke="currentColor" stroke-width="18.0294" stroke-linecap="round" stroke-linejoin="round"></path><path d="M516.012 1314.16V1674.75L40.9387 1400.34V1039.76L353.21 1220.05L516.012 1314.16Z" stroke="currentColor" stroke-width="18.0294" stroke-linecap="round" stroke-linejoin="round"></path><path d="M1696.22 632.651V907.059L1621.58 950.149L1461.66 1042.46V1128.64L1300.12 1221.85L1225.47 1178.76L1224.03 1179.66V905.256L1383.95 812.945L1696.22 632.651Z" stroke="currentColor" stroke-width="18.0294" stroke-linecap="round" stroke-linejoin="round"></path><path d="M1224.03 905.257V1179.66L1149.39 1222.75L988.03 1129.54V1041.56L825.225 947.626L748.96 903.634V631.029L1061.23 811.323L1224.03 905.257Z" stroke="currentColor" stroke-width="18.0294" stroke-linecap="round" stroke-linejoin="round"></path></svg></template><template x-if="slides[i].media==='theme'"><div class="grid grid-cols-3 gap-2 p-4 w-full justify-center"><div class="flex items-center justify-center rounded outline outline-border bg-background"><img src="/images/forms/light.png" alt="Light theme placeholder" class="rounded"></div><div class="flex items-center justify-center rounded outline outline-border bg-background"><img src="/images/forms/dark.png" alt="Dark theme placeholder" class="rounded"></div><div class="flex items-center justify-center rounded outline outline-border bg-background"><img src="/images/forms/system.png" alt="System theme placeholder" class="rounded"></div></div></template><template x-if="slides[i].media==='kbd'"><div class="p-6 flex gap-2 items-center"><kbd class="px-1 size-8 border rounded flex items-center justify-center bg-background border-border text-muted-foreground">⌘</kbd><kbd class="px-1 size-8 border rounded flex items-center justify-center bg-background border-border text-muted-foreground">K</kbd><span class="text-foreground font-medium">then</span><kbd class="px-1 size-8 border rounded flex items-center justify-center bg-background border-border text-muted-foreground">↑</kbd><kbd class="px-1 size-8 border rounded flex items-center justify-center bg-background border-border text-muted-foreground">↓</kbd><kbd class="px-1 size-8 border rounded flex items-center justify-center bg-background border-border text-muted-foreground">↵</kbd></div></template><template x-if="slides[i].media==='done'"><div class="inline-flex items-center justify-center rounded-full size-24 bg-background/20 text-success"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler-circle-check size-8 text-success"><path stroke="none" d="M0 0h24v24H0z" fill="none"></path><path d="M5 12l5 5l10 -10"></path></svg></div></template></div></div></div><!-- Body --><div class="px-5 py-4"><h3 class="text-base font-semibold text-foreground" id="ob-title" x-text="slides[i].title"></h3><p class="text-sm  text-muted-foreground mt-1" x-text="slides[i].body"></p><!-- Slide-specific controls --><div class="mt-3" x-show="slides[i].id==='theme'"><div class="inline-flex gap-2"><button @click="theme='light'" :class="theme==='light' ? 'bg-background : 'outline outline-1 outline-border text-muted-foreground'" class="h-8 px-2 rounded-md text-xs inline-flex items-center gap-1 font-medium"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler-substack size-4"><path stroke="none" d="M0 0h24v24H0z" fill="none"></path><path d="M12 12m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0"></path><path d="M3 12h1m8 -9v1m8 8h1m-9 8v1m-6.4 -15.4l.7 .7m12.1 -.7l-.7 .7m0 11.4l.7 .7m-12.1 -.7l-.7 .7"></path></svg> Light</button><button @click="theme='system'" :class="theme==='system' ? 'bg-background : 'outline outline-1 outline-border text-muted-foreground'" class="h-8 px-2 rounded-md text-xs inline-flex items-center gap-1 font-medium"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler-layout-settings size-4"><path stroke="none" d="M0 0h24v24H0z" fill="none"></path><path d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065z"></path><path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0"></path></svg> System</button><button @click="theme='dark'" :class="theme==='dark' ? 'bg-background : 'outline outline-1 outline-border text-muted-foreground'" class="h-8 px-2 rounded-md text-xs inline-flex items-center gap-1 font-medium"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler-substack size-4"><path stroke="none" d="M0 0h24v24H0z" fill="none"></path><path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454z"></path></svg> Dark</button></div></div><!-- Dots --><div class="mt-4 flex items-center gap-2"><template x-for="(s,idx) in slides" :key="s.id"><button @click="jump(idx)" :aria-current="i===idx" :class="i===idx ? 'bg-muted' : 'bg-muted'" class="size-2 rounded-full"></button></template></div></div><!-- Footer --><div class="px-5 py-4 border-t border-border flex items-center gap-2"><button class="relative flex items-center justify-center text-center font-medium transition-colors duration-200 ease-in-out select-none focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:z-10 justify-center rounded-md text-foreground bg-background outline outline-border hover:bg-muted hover:shadow-sm focus-visible:outline-border h-7 px-3 text-xs h-9 px-3 rounded-md outline outline-1 outline-border text-sm text-foreground" type="button" @click="close()">Skip</button><div class="ml-auto flex items-center gap-2"><button class="relative flex items-center justify-center text-center font-medium transition-colors duration-200 ease-in-out select-none focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:z-10 justify-center rounded-md text-foreground bg-background outline outline-border hover:bg-muted hover:shadow-sm focus-visible:outline-border h-7 px-3 text-xs" type="button" @click="prev()" :disabled="i===0">Back</button><button class="relative flex items-center justify-center text-center font-medium transition-colors duration-200 ease-in-out select-none focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:z-10 justify-center rounded-md text-accent-foreground bg-brand outline outline-brand hover:opacity-90 focus-visible:outline-border h-7 px-3 text-xs" type="button" @click="next()" x-text="last ? 'Finish' : 'Continue'"></button></div></div></div></div></div>
  <script src="runtime.js"></script>
</body>
</html>
