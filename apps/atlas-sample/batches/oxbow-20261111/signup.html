<!doctype html>
<html lang="en" class="font-sans antialiased">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>邮箱注册页</title>
  <link rel="stylesheet" href="runtime.css">
</head>
<body class="bg-background" data-demo="signup">
<section class="bg-background"><div class="px-8 py-24 mx-auto max-w-7xl md:px-12 lg:px-20"><div class="max-w-md p-8 mx-auto bg-background rounded-xl"><div class="text-center"><h1 class="text-xl   md:text-2xl lg:text-3xl font-semibold tracking-tight text-foreground">Sign up, no nonsense</h1><p class="text-base mt-2 text-muted-foreground text-balance">Just your email and a password. That’s it. You’re in.</p></div><form class="mt-10 space-y-4"><div class="w-full"><div class="flex justify-between items-baseline mb-1"><label for="email" class="font-medium text-muted-foreground text-sm">Email Address</label></div><div class="relative z-0 focus-within:z-10"><div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler-arrow-mail size-4 text-muted-foreground"><path stroke="none" d="M0 0h24v24H0z" fill="none"></path><path d="M3 7a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v10a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-10z"></path><path d="M3 7l9 6l9 -6"></path></svg></div><input placeholder="you@example.com" id="email" name="email" type="email" class="w-full block transition duration-300 ease-in-out leading-tight align-middle focus:z-10 pl-10 h-10 px-4 py-2 text-sm rounded-md bg-background border border-transparent text-muted-foreground ring-1 ring-border placeholder:text-muted-foreground focus:border-border focus:ring-border focus:ring-2 focus:outline-none shadow-sm bg-background text-foreground ring-border placeholder:text-muted-foreground focus:border-border focus:ring-border " inputmode="email"></div></div><div class="w-full"><div class="flex justify-between items-baseline mb-1"><label for="password" class="font-medium text-muted-foreground text-sm">Password</label></div><div class="relative z-0 focus-within:z-10" x-data="{ value: &quot;&quot;, showPassword: false }"><input placeholder="••••••••" required id="password" name="password" x-model="value" x-bind:type="showPassword ? 'text' : 'password'" class="w-full block transition duration-300 ease-in-out leading-tight align-middle focus:z-10 h-10 px-4 py-2 text-sm rounded-md bg-background border border-transparent text-muted-foreground ring-1 ring-border placeholder:text-muted-foreground focus:border-border focus:ring-border focus:ring-2 focus:outline-none shadow-sm bg-background text-foreground ring-border placeholder:text-muted-foreground focus:border-border focus:ring-border " aria-required="true"><div class="absolute inset-y-0 right-0 flex items-center pr-3 gap-2"><button type="button" @click="showPassword = !showPassword" class="text-muted-foreground focus:outline-none" tabindex="-1" aria-label="Toggle password visibility"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler-external-link size-4" x-show="!showPassword"><path stroke="none" d="M0 0h24v24H0z" fill="none"></path><path d="M10 12a2 2 0 1 0 4 0a2 2 0 0 0 -4 0"></path><path d="M21 12c-2.4 4 -5.4 6 -9 6c-3.6 0 -6.6 -2 -9 -6c2.4 -4 5.4 -6 9 -6c3.6 0 6.6 2 9 6"></path></svg><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler-external-link size-4" x-show="showPassword"><path stroke="none" d="M0 0h24v24H0z" fill="none"></path><path d="M10.585 10.587a2 2 0 0 0 2.829 2.828"></path><path d="M16.681 16.673a8.717 8.717 0 0 1 -4.681 1.327c-3.6 0 -6.6 -2 -9 -6c1.272 -2.12 2.712 -3.678 4.32 -4.674m2.86 -1.146a9.055 9.055 0 0 1 1.82 -.18c3.6 0 6.6 2 9 6c-.666 1.11 -1.379 2.067 -2.138 2.87"></path><path d="M3 3l18 18"></path></svg></button><button x-show="value" type="button" @click="value = ''" class="text-muted-foreground hover:text-muted-foreground focus:outline-none" aria-label="Clear input"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler-wave-x size-4 text-muted-foreground"><path stroke="none" d="M0 0h24v24H0z" fill="none"></path><path d="M18 6l-12 12"></path><path d="M6 6l12 12"></path></svg></button></div></div></div><p class="text-xs  font-medium text-muted-foreground">By creating an account, you agree to our<a href="#_" class="font-medium text-foreground hover:text-muted-foreground">Terms of service</a>and<a href="#_" class="font-medium text-foreground hover:text-muted-foreground">Privacy Policy</a></p><button class="relative flex items-center justify-center text-center font-medium transition-colors duration-200 ease-in-out select-none focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:z-10 justify-center rounded-md w-full text-background bg-foreground outline outline-foreground hover:opacity-90 focus-visible:outline-border h-10 px-5 text-sm">Create account</button></form><p class="text-xs  mt-4 font-medium text-muted-foreground">Already have an account?<a href="#_" class="font-medium text-foreground hover:text-muted-foreground">Sign in</a></p></div></div></section>
  <script src="runtime.js"></script>
</body>
</html>
