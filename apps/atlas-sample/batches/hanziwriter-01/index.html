<!DOCTYPE html>
<html lang="en-us">
	<head>
		<meta charset="utf-8">
		<title>Hanzi Writer</title>
		
		<link rel="stylesheet" href="runtime.css">
		
	</head>
	<body>

		<h1 class="title">Hanzi Writer</h1><p class="scope">原版笔顺与描红练习，离线内置：我、人、永；其它字不会联网。字形 © 1999 Arphic Technology Co., Ltd.，无担保，可按 Arphic Public License 再分发；完整条款见随附 ARPHICPL.TXT。</p><p id="status" role="status" aria-live="polite"></p>
		<form class="js-char-form char-form">
			<label>
				Character
				<input type="text" class="js-char char-input" size="1" maxlength="1" autocomplete="off" value="我" />
			</label>
			<button type="submit">Update</button>
		</form>
		<div class="actions">
			<button class="js-toggle">Show/hide</button>
			<button class="js-toggle-hint">Outline on/off</button>
			<button class="js-animate">Animate</button>
			<button class="js-quiz">Quiz yourself</button>
		</div>

		<div id="target">

		</div>

		
		
		

	<script src="runtime.js"></script></body>
</html>
