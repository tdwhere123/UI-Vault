{
  "name": "Publish UI Vault atlas",
  "on": {
    "push": {
      "branches": [
        "main"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read",
    "pages": "write",
    "id-token": "write"
  },
  "concurrency": {
    "group": "github-pages",
    "cancel-in-progress": true
  },
  "jobs": {
    "pages": {
      "if": "github.repository == 'tdwhere123/UI-Vault' && github.ref == 'refs/heads/main'",
      "runs-on": "ubuntu-latest",
      "environment": {
        "name": "github-pages",
        "url": "${{ steps.deployment.outputs.page_url }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@v6",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-node@v7",
          "with": {
            "node-version": "22"
          }
        },
        {
          "name": "Test and export current atlas",
          "shell": "bash",
          "run": "set -euo pipefail\nnpm run build\nnode scripts/export-pages.mjs \"$RUNNER_TEMP/ui-vault-pages\" /UI-Vault/\ngit diff --exit-code"
        },
        {
          "uses": "actions/configure-pages@v5"
        },
        {
          "uses": "actions/upload-pages-artifact@v4",
          "with": {
            "path": "${{ runner.temp }}/ui-vault-pages"
          }
        },
        {
          "name": "Reject superseded main revisions",
          "shell": "bash",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "set -euo pipefail\nlatest=\"$(gh api \"repos/${GITHUB_REPOSITORY}/git/ref/heads/main\" --jq '.object.sha')\"\ntest \"$latest\" = \"$GITHUB_SHA\""
        },
        {
          "name": "Deploy Pages",
          "id": "deployment",
          "uses": "actions/deploy-pages@v4"
        }
      ]
    }
  }
}
